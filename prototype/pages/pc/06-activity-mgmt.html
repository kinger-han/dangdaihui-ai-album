<!-- PAGE_META: {"id": "activity-mgmt", "title": "活动管理"} -->
<div class="page" id="page-activity-mgmt">
  <style>
    /* 活动管理页：数据的最上层归属。设备 / 模板 / 画风 / 照片都挂在活动下，
       客户由活动带出。状态由运营手动控制，不与起止时间强耦合。 */
    .act-tbl { width: 100%; border-collapse: collapse; background: #fff; }
    .act-tbl th { text-align: left; padding: 10px 12px; border-bottom: 1px solid #f0f0f0; font-size: 13px; color: #666; font-weight: 600; background: #FAFAFA; }
    .act-tbl td { padding: 10px 12px; border-bottom: 1px solid #f0f0f0; font-size: 13px; color: #333; }
    .act-tbl tr:hover { background: #fafcff; }
    .act-state { display: inline-block; padding: 2px 10px; border-radius: 3px; font-size: 12px; }
    .act-state.running { color: #52c41a; background: #f6ffed; border: 1px solid #b7eb8f; }
    .act-state.ended   { color: #999; background: #f5f5f5; border: 1px solid #e8e8e8; }
    .act-state.notstart{ color: #1677ff; background: #e6f4ff; border: 1px solid #91caff; }

    /* 活动配置弹窗：两个页签 */
    .ac-modal { position: fixed; inset: 0; z-index: 1300; display: none; align-items: center; justify-content: center; }
    .ac-modal-mask { position: absolute; inset: 0; background: rgba(0,0,0,0.45); }
    .ac-modal-box { position: relative; background: #fff; border-radius: 8px; width: 900px; max-height: 88vh; display: flex; flex-direction: column; box-shadow: 0 8px 32px rgba(0,0,0,0.15); }
    .ac-modal-title { font-size: 15px; font-weight: 600; color: #333; padding: 18px 24px 12px; border-bottom: 1px solid #f0f0f0; }
    .ac-tabs { display: flex; gap: 2px; padding: 10px 24px 0; border-bottom: 1px solid #f0f0f0; }
    .ac-tab { padding: 7px 16px; font-size: 13px; color: #666; cursor: pointer; border: 1px solid transparent; border-bottom: none; border-radius: 4px 4px 0 0; margin-bottom: -1px; }
    .ac-tab:hover { color: #0B5DEA; }
    .ac-tab.active { color: #0B5DEA; background: #fff; border-color: #f0f0f0; font-weight: 500; }
    .ac-body { padding: 18px 24px; overflow-y: auto; flex: 1; }
    .ac-pane { display: none; }
    .ac-pane.active { display: block; }
    .ac-row { display: flex; gap: 16px; margin-bottom: 14px; }
    .ac-field { flex: 1; min-width: 0; }
    .ac-lbl { display: block; font-size: 13px; color: #666; margin-bottom: 6px; }
    .ac-lbl .req { color: #f5222d; margin-left: 2px; }
    .ac-input { width: 100%; box-sizing: border-box; height: 32px; border: 1px solid #d9d9d9; border-radius: 4px; padding: 0 10px; font-size: 13px; color: #333; }
    .ac-textarea { width: 100%; box-sizing: border-box; min-height: 70px; border: 1px solid #d9d9d9; border-radius: 4px; padding: 8px 10px; font-size: 13px; color: #333; line-height: 1.6; resize: vertical; }
    .ac-tip { font-size: 12px; color: #999; line-height: 1.6; margin-top: 4px; }
    .ac-sub { font-size: 13px; font-weight: 500; color: #333; margin: 4px 0 8px; padding-left: 8px; border-left: 3px solid #0B5DEA; }
    .ac-footer { display: flex; justify-content: flex-end; gap: 12px; padding: 14px 24px; border-top: 1px solid #f0f0f0; }
    .ac-btn { height: 32px; padding: 0 16px; border-radius: 4px; border: 1px solid #d9d9d9; background: #fff; font-size: 13px; cursor: pointer; color: #333; }
    .ac-btn:hover { color: #0B5DEA; border-color: #0B5DEA; }
    .ac-btn.primary { background: #0B5DEA; border-color: #0B5DEA; color: #fff; }
    .ac-btn.primary:hover { background: #3a7bef; border-color: #3a7bef; }

    /* 创作能力选择器：搜索 + 全选 + 表格 */
    .ac-pick-bar { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
    .ac-pick-bar .filter-input { width: 200px; height: 30px; }
    .ac-pick-bar .ac-all-label { font-size: 13px; color: #333; display: flex; align-items: center; gap: 5px; cursor: pointer; user-select: none; }
    .ac-pick-tbl { width: 100%; border-collapse: collapse; }
    .ac-pick-tbl th { background: #FAFAFA; padding: 8px 10px; font-size: 12px; color: #666; font-weight: 600; text-align: left; border-bottom: 1px solid #eee; position: sticky; top: 0; }
    .ac-pick-tbl td { padding: 7px 10px; font-size: 13px; color: #333; border-bottom: 1px solid #f7f7f7; }
    .ac-pick-tbl tr:last-child td { border-bottom: none; }
    .ac-pick-tbl tr:hover td { background: #fafcff; }
    .ac-pick-wrap { max-height: 220px; overflow-y: auto; border: 1px solid #eee; border-radius: 4px; }
    .ac-thumb { width: 34px; height: 46px; border-radius: 3px; overflow: hidden; position: relative; display: inline-block; background: #F0EAE0; vertical-align: middle; }
    .ac-thumb .pt-bg2 { position: absolute; inset: 0; }
    .ac-thumb .pt-person2 { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 55%; aspect-ratio: 3/4; border-radius: 2px; background: linear-gradient(135deg,#F5D0A9,#D9A066); }
    .ac-thumb.style { background: #F2F2F2; }
    .ac-thumb.style .pt-person2 { width: 62%; border-radius: 4px; background: linear-gradient(135deg,#B9C6D6,#8FA3B8); }
    .ac-thumb.style.effect-guangying .pt-person2 { filter: brightness(1.08) contrast(1.06); }
    .ac-thumb.style.effect-shuimo .pt-person2 { filter: grayscale(0.55) sepia(0.35); }
    .ac-thumb.style.effect-hongchou .pt-person2 { filter: sepia(0.22) saturate(1.12); }
    .ac-thumb.style.effect-shouhui .pt-person2 { filter: saturate(0.45) contrast(1.12); }
    .ac-state-tag { display: inline-block; padding: 1px 8px; border-radius: 3px; font-size: 11px; }
    .ac-state-tag.on { color: #52c41a; background: #f6ffed; border: 1px solid #b7eb8f; }
    .ac-state-tag.off { color: #999; background: #f5f5f5; border: 1px solid #e8e8e8; }
  </style>

  <div class="filter-bar">
    <div class="filter-item">
      <input class="filter-input" id="act-f-name" placeholder="请输入活动名称" oninput="actApplyFilter()">
    </div>
    <div class="filter-item">
      <select class="filter-select" id="act-f-cust" onchange="actApplyFilter()"></select>
    </div>
    <div class="filter-item">
      <span class="filter-label">活动状态</span>
      <select class="filter-select" id="act-f-state" onchange="actApplyFilter()">
        <option value="">全部</option>
        <option value="notstart">未开始</option>
        <option value="running">进行中</option>
        <option value="ended">已结束</option>
      </select>
    </div>
    <div class="filter-item">
      <button class="filter-btn" onclick="actResetFilter()">重置</button>
      <button class="filter-btn search" onclick="actApplyFilter()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>搜索</button>
      <button class="filter-btn primary" onclick="actOpenModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>新建活动</button>
    </div>
  </div>

  <div class="table-card">
    <table class="act-tbl">
      <thead>
        <tr>
          <th>活动名称</th>
          <th>所属客户</th>
          <th>活动状态</th>
          <th>开始/结束日期</th>
          <th>更新时间</th>
          <th style="width:220px">操作</th>
        </tr>
      </thead>
      <tbody id="act-tbody"></tbody>
    </table>
    <div class="pagination" id="act-pager"></div>
  </div>

  <!-- 新建/编辑活动弹窗（2 个页签） -->
  <div class="ac-modal" id="ac-modal" style="display:none">
    <div class="ac-modal-mask" onclick="actCloseModal()"></div>
    <div class="ac-modal-box">
      <div class="ac-modal-title" id="ac-modal-title">新建活动</div>
      <div class="ac-tabs">
        <div class="ac-tab active" onclick="actSwitchTab('basic', this)">基础信息</div>
        <div class="ac-tab" onclick="actSwitchTab('ability', this)">创作能力</div>
      </div>
      <div class="ac-body">
        <div class="ac-pane active" id="ac-pane-basic">
          <div class="ac-row">
            <div class="ac-field"><label class="ac-lbl">活动名称 <span class="req">*</span></label>
              <input class="ac-input" id="ac-name" placeholder="如：福建省第十二次党代会纪念相册"></div>
          </div>
          <div class="ac-row">
            <div class="ac-field"><label class="ac-lbl">所属客户 <span class="req">*</span></label>
              <select class="ac-input" id="ac-cust"></select>
              <div class="ac-tip">客户取自系统客户表。活动归属客户后，设备与照片的客户由活动带出</div></div>
            <div class="ac-field"><label class="ac-lbl">活动状态 <span class="req">*</span></label>
              <select class="ac-input" id="ac-state">
                <option value="notstart">未开始</option>
                <option value="running">进行中</option>
                <option value="ended">已结束</option>
              </select>
              <div class="ac-tip">由运营手动控制，不随起止时间自动变化</div></div>
          </div>
          <div class="ac-row">
            <div class="ac-field"><label class="ac-lbl">活动介绍</label>
              <textarea class="ac-textarea" id="ac-intro" placeholder="一句话说明本活动是什么"></textarea></div>
          </div>
          <div class="ac-row">
            <div class="ac-field"><label class="ac-lbl">开始日期</label>
              <input class="ac-input" id="ac-start" type="date"></div>
            <div class="ac-field"><label class="ac-lbl">结束日期</label>
              <input class="ac-input" id="ac-end" type="date"></div>
          </div>
        </div>

        <div class="ac-pane" id="ac-pane-ability">
          <div class="ac-tip" style="margin-bottom:14px">勾选本活动可用的画风与模板。保存后自动同步到模板/画风管理的「归属活动」；在那边改归属，这里也会同步。</div>
          <div class="ac-sub">启用画风</div>
          <div class="ac-pick-bar">
            <input class="filter-input" id="ac-style-kw" placeholder="请输入画风名称" oninput="actRenderStylePick()">
            <span class="ac-all-label" onclick="actToggleAllStyle()"><input type="checkbox" id="ac-style-all">全选</span>
            <span class="ac-tip" id="ac-style-count"></span>
          </div>
          <div class="ac-pick-wrap">
            <table class="ac-pick-tbl">
              <thead><tr><th style="width:40px"></th><th style="width:60px">示例</th><th>画风名称</th><th style="width:100px">合成模式</th><th style="width:80px">状态</th></tr></thead>
              <tbody id="ac-style-rows"></tbody>
            </table>
          </div>
          <div class="ac-sub" style="margin-top:20px">启用模板</div>
          <div class="ac-pick-bar">
            <input class="filter-input" id="ac-tpl-kw" placeholder="请输入模板名称" oninput="actRenderTplPick()">
            <span class="ac-all-label" onclick="actToggleAllTpl()"><input type="checkbox" id="ac-tpl-all">全选</span>
            <span class="ac-tip" id="ac-tpl-count"></span>
          </div>
          <div class="ac-pick-wrap">
            <table class="ac-pick-tbl">
              <thead><tr><th style="width:40px"></th><th style="width:60px">模板图片</th><th>模板名称</th><th style="width:90px">模板方向</th><th style="width:80px">状态</th></tr></thead>
              <tbody id="ac-tpl-rows"></tbody>
            </table>
          </div>
        </div>
      </div>
      <div class="ac-footer">
        <button class="ac-btn" onclick="actCloseModal()">取消</button>
        <button class="ac-btn primary" onclick="actSave()">保存</button>
      </div>
    </div>
  </div>

  <div id="act-toast-area"></div>
</div>

<script>
/* ================= 活动管理（数据的最上层归属） ================= */
var ACT_PAGE = 1;
var ACT_PAGE_SIZE = 10;
var ACT_EDIT_ID = null;
/* 弹窗内勾选暂存，保存时写回模板/画风的 actIds，再由 sync 重建活动侧 */
var AC_PICK_STYLE = {};
var AC_PICK_TPL = {};

function actList() { return (window.__ACTIVITY_LIST = window.__ACTIVITY_LIST || []); }
function actNowStr() {
  var d = new Date();
  function p(n) { return ('0' + n).slice(-2); }
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}
function actShowToast(msg) {
  var ta = document.getElementById('act-toast-area');
  ta.innerHTML = '<div class="toast" style="position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:2000;background:rgba(0,0,0,0.82);color:#fff;padding:12px 24px;border-radius:8px;font-size:14px">' + msg + '</div>';
  setTimeout(function(){ ta.innerHTML = ''; }, 1800);
}
function actStatusKey(a) { return (a.status === 'running' || a.status === 'ended') ? a.status : 'notstart'; }
function actStateTag(k) {
  return '<span class="act-state ' + k + '">' + pcActivityStatusText(k) + '</span>';
}
function actFillCustomerFilter() {
  var el = document.getElementById('act-f-cust');
  var opts = '<option value="">全部客户</option>';
  (window.__CUSTOMER_LIST || []).forEach(function(c) {
    if (c.enabled === false) return;
    opts += '<option value="' + c.id + '">' + c.name + '</option>';
  });
  el.innerHTML = opts;
}
function renderActTable() {
  var kw = (document.getElementById('act-f-name').value || '').trim();
  var custF = document.getElementById('act-f-cust').value;
  var stF = document.getElementById('act-f-state').value;
  var list = actList().filter(function(a) {
    if (kw && a.name.indexOf(kw) < 0) return false;
    if (custF && a.customerId !== custF) return false;
    if (stF && actStatusKey(a) !== stF) return false;
    return true;
  });
  list = list.slice().sort(function(a, b) { return a.updateTime < b.updateTime ? 1 : (a.updateTime > b.updateTime ? -1 : 0); });
  var start = (ACT_PAGE - 1) * ACT_PAGE_SIZE;
  var pageList = list.slice(start, start + ACT_PAGE_SIZE);
  var tb = document.getElementById('act-tbody');
  var html = '';
  pageList.forEach(function(a) {
    var c = pcCustomerOf(a.customerId);
    var st = actStatusKey(a);
    var ended = (st === 'ended');
    html += '<tr>' +
      '<td>' + a.name + '</td>' +
      '<td>' + (c ? c.name : '—') + '</td>' +
      '<td>' + actStateTag(st) + '</td>' +
      '<td>' + (a.startTime || '—') + '<br><span style="color:#999">' + (a.endTime || '—') + '</span></td>' +
      '<td>' + (a.updateTime || '—') + '</td>' +
      '<td>' +
        '<a class="action-link" onclick="actOpenModal(\'' + a.id + '\')">编辑</a>' +
        '<a class="action-link" onclick="actEnable(\'' + a.id + '\')">启用</a>' +
        (ended
          ? '<span style="color:#ccc">结束</span>'
          : '<a class="action-link warn" onclick="actEnd(\'' + a.id + '\')">结束</a>') +
        '<a class="action-link warn" onclick="actDel(\'' + a.id + '\')">删除</a>' +
      '</td>' +
      '</tr>';
  });
  if (!pageList.length) html = '<tr><td colspan="6" style="text-align:center;color:#999;padding:40px 0">暂无符合条件的活动</td></tr>';
  tb.innerHTML = html;
  window.__PAGER['act-pager'] = function(pg) { ACT_PAGE = pg; renderActTable(); };
  renderPager('act-pager', list.length, ACT_PAGE, ACT_PAGE_SIZE);
}
function actApplyFilter() { ACT_PAGE = 1; renderActTable(); }
function actResetFilter() {
  document.getElementById('act-f-name').value = '';
  document.getElementById('act-f-cust').value = '';
  document.getElementById('act-f-state').value = '';
  renderActTable();
}
/* 行内状态操作：只原地变色，不重排序 */
function actEnable(id) {
  var a = pcActivityOf(id);
  if (!a) return;
  if (actStatusKey(a) === 'running') { actShowToast('活动已在进行中：' + a.name); return; }
  if (actStatusKey(a) === 'ended') {
    var devCnt = pcActivityEnabledDevices(a.id).length;
    var tip = '确定重新启用已结束的活动「' + a.name + '」吗？\n\n启用后状态回到「进行中」。'
      + (devCnt ? '\n该活动下有 ' + devCnt + ' 台已启用设备，扫码将重新生效。' : '\n该活动下没有已启用设备，扫码不生效。')
      + '\n\n（设备启停需人工在设备管理里调整，不会自动变更）';
    if (!confirm(tip)) return;
  }
  a.status = 'running';
  a.updateTime = actNowStr();
  actShowToast('已启用：' + a.name);
  renderActTable();
}
function actEnd(id) {
  var a = pcActivityOf(id);
  if (!a) return;
  var devCnt = pcActivityEnabledDevices(a.id).length;
  var tip = '确定结束活动「' + a.name + '」吗？\n\n结束后可再重新启用回「进行中」。'
    + (devCnt ? '\n该活动下 ' + devCnt + ' 台设备仍为启用状态，设备启停需人工在设备管理里调整。' : '');
  if (!confirm(tip)) return;
  a.status = 'ended';
  a.updateTime = actNowStr();
  actShowToast('活动已结束：' + a.name);
  renderActTable();
}

/* 删除活动：设备 / 照片有归属时阻断；模板 / 画风是多选引用关系，删除时自动解除关联 */
function actDel(id) {
  var a = pcActivityOf(id);
  if (!a) return;
  var devCnt = pcActivityDevices(id).length; /* 含停用记录：设备必须先删除或改投 */
  var phCnt = (typeof PHOTO_LIST !== 'undefined' ? PHOTO_LIST : [])
    .filter(function(p) { return (typeof _pActOf === 'function' ? _pActOf(p) : (p.actId || '')) === id; }).length;
  if (devCnt || phCnt) {
    alert('无法删除活动「' + a.name + '」：\n\n该活动下还有 ' + devCnt + ' 台设备记录、' + phCnt + ' 张照片。'
      + '\n请先在设备管理中删除或改投设备、清理照片后再试。');
    return;
  }
  var tplCnt = 0, stCnt = 0;
  (window.__TPL_LIST || []).forEach(function(t) { if ((t.actIds || []).indexOf(id) >= 0) tplCnt++; });
  (window.__STYLE_LIST || []).forEach(function(s) { if ((s.actIds || []).indexOf(id) >= 0) stCnt++; });
  var tip = '确定删除活动「' + a.name + '」吗？';
  if (tplCnt || stCnt) tip += '\n\n将同时解除 ' + tplCnt + ' 个模板、' + stCnt + ' 个画风的归属关联。';
  tip += '\n\n删除后不可恢复。';
  if (!confirm(tip)) return;
  window.__ACTIVITY_LIST = window.__ACTIVITY_LIST.filter(function(x) { return x.id !== id; });
  (window.__TPL_LIST || []).forEach(function(t) { t.actIds = (t.actIds || []).filter(function(x) { return x !== id; }); });
  (window.__STYLE_LIST || []).forEach(function(s) { s.actIds = (s.actIds || []).filter(function(x) { return x !== id; }); });
  pcSyncActivityFromAssets();
  ACT_PAGE = 1;
  actShowToast('已删除活动：' + a.name);
  renderActTable();
  actRefreshPeers();
}

/* ---- 创作能力选择器 ---- */
function actTplBg(id) {
  var n = 0; for (var i = 0; i < id.length; i++) n += id.charCodeAt(i);
  return (n % 8) + 1;
}
function actRenderStylePick() {
  var kw = (document.getElementById('ac-style-kw').value || '').trim();
  var all = (window.__STYLE_LIST || []).slice().sort(function(a, b) { return (a.sort || 0) - (b.sort || 0); });
  var list = all.filter(function(s) { return !kw || s.name.indexOf(kw) >= 0; });
  var html = '';
  list.forEach(function(s) {
    var off = s.enabled === false;
    html += '<tr>' +
      '<td><input type="checkbox" data-id="' + s.id + '"' + (AC_PICK_STYLE[s.id] ? ' checked' : '') + ' onclick="acPickStyle(this)"></td>' +
      '<td><span class="ac-thumb style effect-' + s.id + '"><span class="pt-person2"></span></span></td>' +
      '<td>' + s.name + '</td>' +
      '<td>' + (s.mode || '默认合成') + '</td>' +
      '<td>' + (off ? '<span class="ac-state-tag off">停用</span>' : '<span class="ac-state-tag on">启用</span>') + '</td>' +
      '</tr>';
  });
  if (!list.length) html = '<tr><td colspan="5" style="text-align:center;color:#999;padding:20px 0">没有匹配的画风</td></tr>';
  document.getElementById('ac-style-rows').innerHTML = html;
  document.getElementById('ac-style-count').textContent = '已选 ' + Object.keys(AC_PICK_STYLE).length + ' 个';
  var allEl = document.getElementById('ac-style-all');
  if (allEl) allEl.checked = list.length > 0 && list.every(function(s) { return !!AC_PICK_STYLE[s.id]; });
}
function actRenderTplPick() {
  var kw = (document.getElementById('ac-tpl-kw').value || '').trim();
  var list = (window.__TPL_LIST || []).filter(function(t) { return !kw || t.name.indexOf(kw) >= 0; });
  var html = '';
  list.forEach(function(t) {
    var off = t.state === 'off';
    html += '<tr>' +
      '<td><input type="checkbox" data-id="' + t.id + '"' + (AC_PICK_TPL[t.id] ? ' checked' : '') + ' onclick="acPickTpl(this)"></td>' +
      '<td><span class="ac-thumb"><span class="pt-bg2 wb-' + actTplBg(t.id) + '"></span><span class="pt-person2"></span></span></td>' +
      '<td>' + t.name + '</td>' +
      '<td>' + (t.direction || '—') + '</td>' +
      '<td>' + (off ? '<span class="ac-state-tag off">停用</span>' : '<span class="ac-state-tag on">启用</span>') + '</td>' +
      '</tr>';
  });
  if (!list.length) html = '<tr><td colspan="5" style="text-align:center;color:#999;padding:20px 0">没有匹配的模板</td></tr>';
  document.getElementById('ac-tpl-rows').innerHTML = html;
  document.getElementById('ac-tpl-count').textContent = '已选 ' + Object.keys(AC_PICK_TPL).length + ' 个';
  var allEl = document.getElementById('ac-tpl-all');
  if (allEl) allEl.checked = list.length > 0 && list.every(function(t) { return !!AC_PICK_TPL[t.id]; });
}
function acPickStyle(el) {
  var id = el.getAttribute('data-id');
  if (el.checked) AC_PICK_STYLE[id] = true; else delete AC_PICK_STYLE[id];
  actRenderStylePick();
}
function acPickTpl(el) {
  var id = el.getAttribute('data-id');
  if (el.checked) AC_PICK_TPL[id] = true; else delete AC_PICK_TPL[id];
  actRenderTplPick();
}
function actToggleAllStyle() {
  var kw = (document.getElementById('ac-style-kw').value || '').trim();
  var list = (window.__STYLE_LIST || []).filter(function(s) { return !kw || s.name.indexOf(kw) >= 0; });
  var allOn = list.length > 0 && list.every(function(s) { return !!AC_PICK_STYLE[s.id]; });
  list.forEach(function(s) { if (allOn) delete AC_PICK_STYLE[s.id]; else AC_PICK_STYLE[s.id] = true; });
  actRenderStylePick();
}
function actToggleAllTpl() {
  var kw = (document.getElementById('ac-tpl-kw').value || '').trim();
  var list = (window.__TPL_LIST || []).filter(function(t) { return !kw || t.name.indexOf(kw) >= 0; });
  var allOn = list.length > 0 && list.every(function(t) { return !!AC_PICK_TPL[t.id]; });
  list.forEach(function(t) { if (allOn) delete AC_PICK_TPL[t.id]; else AC_PICK_TPL[t.id] = true; });
  actRenderTplPick();
}

/* ---- 弹窗 ---- */
var AC_TABS = ['basic', 'ability'];
function actSwitchTab(name, el) {
  AC_TABS.forEach(function(t) {
    var pane = document.getElementById('ac-pane-' + t);
    if (pane) pane.classList.remove('active');
  });
  var tabs = document.querySelectorAll('#ac-modal .ac-tab');
  for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove('active');
  var p = document.getElementById('ac-pane-' + name);
  if (p) p.classList.add('active');
  if (el) el.classList.add('active');
}
function actOpenModal(id) {
  ACT_EDIT_ID = id || null;
  var a = id ? pcActivityOf(id) : null;
  document.getElementById('ac-modal-title').textContent = id ? '编辑活动' : '新建活动';
  var cOpts = '<option value="">请选择所属客户</option>';
  (window.__CUSTOMER_LIST || []).forEach(function(c) {
    if (c.enabled === false) return;
    cOpts += '<option value="' + c.id + '">' + c.name + '</option>';
  });
  var custSel = document.getElementById('ac-cust');
  custSel.innerHTML = cOpts;
  document.getElementById('ac-name').value = a ? a.name : '';
  document.getElementById('ac-intro').value = a ? (a.intro || '') : '';
  document.getElementById('ac-start').value = a ? (a.startTime || '') : '';
  document.getElementById('ac-end').value = a ? (a.endTime || '') : '';
  document.getElementById('ac-state').value = a ? actStatusKey(a) : 'notstart';
  custSel.value = a ? (a.customerId || '') : '';
  var aid = a ? a.id : '';
  AC_PICK_STYLE = {};
  AC_PICK_TPL = {};
  (window.__STYLE_LIST || []).forEach(function(s) {
    if (aid && (s.actIds || []).indexOf(aid) >= 0) AC_PICK_STYLE[s.id] = true;
  });
  (window.__TPL_LIST || []).forEach(function(t) {
    if (aid && (t.actIds || []).indexOf(aid) >= 0) AC_PICK_TPL[t.id] = true;
  });
  document.getElementById('ac-style-kw').value = '';
  document.getElementById('ac-tpl-kw').value = '';
  actRenderStylePick();
  actRenderTplPick();
  var tabs = document.querySelectorAll('#ac-modal .ac-tab');
  for (var i = 0; i < tabs.length; i++) tabs[i].classList.toggle('active', i === 0);
  AC_TABS.forEach(function(t) { var p = document.getElementById('ac-pane-' + t); if (p) p.classList.remove('active'); });
  var p0 = document.getElementById('ac-pane-basic');
  if (p0) p0.classList.add('active');
  document.getElementById('ac-modal').style.display = 'flex';
}
function actCloseModal() { document.getElementById('ac-modal').style.display = 'none'; }
function actSave() {
  var name = document.getElementById('ac-name').value.trim();
  var custId = document.getElementById('ac-cust').value;
  if (!name) { actShowToast('请填写活动名称'); return; }
  if (!custId) { actShowToast('请选择所属客户'); return; }
  var styleIds = Object.keys(AC_PICK_STYLE);
  var tplIds = Object.keys(AC_PICK_TPL);
  var data = {
    name: name,
    customerId: custId,
    status: document.getElementById('ac-state').value,
    intro: document.getElementById('ac-intro').value.trim(),
    startTime: document.getElementById('ac-start').value.trim(),
    endTime: document.getElementById('ac-end').value.trim(),
    updateTime: actNowStr()
  };
  var actId;
  if (ACT_EDIT_ID) {
    var a = pcActivityOf(ACT_EDIT_ID);
    if (a) { for (var k in data) a[k] = data[k]; actId = a.id; }
    actShowToast('活动已保存：' + name);
  } else {
    data.id = 'act' + (actList().length + 1);
    data.code = 'ACT-2026-' + ('00' + (actList().length + 1)).slice(-3);
    data.scanCount = 0; data.workCount = 0; data.pickCount = 0;
    actList().push(data);
    actId = data.id;
    actShowToast('活动已新建：' + name);
  }
  /* 写回模板/画风侧 actIds（多选），再由 sync 重建各活动的启用清单 */
  (window.__TPL_LIST || []).forEach(function(t) {
    var ids = t.actIds || [];
    var i = ids.indexOf(actId);
    var want = tplIds.indexOf(t.id) >= 0;
    if (want && i < 0) { t.actIds = ids.concat([actId]); t.time = actNowStr(); }
    else if (!want && i >= 0) { t.actIds = ids.filter(function(x) { return x !== actId; }); t.time = actNowStr(); }
  });
  (window.__STYLE_LIST || []).forEach(function(s) {
    var ids = s.actIds || [];
    var i = ids.indexOf(actId);
    var want = styleIds.indexOf(s.id) >= 0;
    if (want && i < 0) s.actIds = ids.concat([actId]);
    else if (!want && i >= 0) s.actIds = ids.filter(function(x) { return x !== actId; });
  });
  pcSyncActivityFromAssets();
  actCloseModal();
  renderActTable();
  actRefreshPeers();
}
/* 刷新模板/画风列表，让归属列立刻反映本次改动 */
function actRefreshPeers() {
  if (typeof renderTplMgmt === 'function') { try { renderTplMgmt(); } catch (e) {} }
  if (typeof renderStMgmt === 'function') { try { renderStMgmt(); } catch (e) {} }
}
function init_activity_mgmt() { actFillCustomerFilter(); renderActTable(); }
init_activity_mgmt();
</script>
