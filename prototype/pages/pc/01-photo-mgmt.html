<!-- PAGE_META: {"id": "photo-mgmt", "title": "照片管理"} -->
<div class="page" id="page-photo-mgmt">
  <style>
    /* 照片管理页局部样式（组件内 style 随页面注入保留） */
    .photo-tbl th, .photo-tbl td { text-align: left; }
    .photo-tbl .thumb-cell { width: 56px; }
    .photo-thumb {
      width: 44px; height: 58px; border-radius: 4px; overflow: hidden;
      position: relative; cursor: zoom-in; display: inline-block;
      background: #F0EAE0; vertical-align: middle;
    }
    .photo-thumb .pt-bg { position: absolute; inset: 0; }
    .photo-thumb .pt-person {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
      width: 55%; aspect-ratio: 3/4; border-radius: 3px; z-index: 2;
      background: linear-gradient(135deg, #F5D0A9, #D9A066);
      border: 1.5px solid rgba(255,255,255,0.8);
    }
    .td-check { width: 36px; }
    .selection-cell .badge-status { margin-right: 4px; }
    /* 统计看板 */
    .stat-cards { display: flex; gap: 12px; margin-bottom: 14px; }
    .stat-card {
      flex: 1; background: #fff; border: 1px solid #eee; border-radius: 6px;
      padding: 14px 16px; display: flex; align-items: center; gap: 12px;
    }
    .stat-card .sc-num { font-size: 24px; font-weight: 700; color: #0B5DEA; }
    .stat-card .sc-label { font-size: 13px; color: #666; }
    /* 大图预览 */
    .preview-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000;
      display: none; align-items: center; justify-content: center;
    }
    .preview-overlay.show { display: flex; }
    .preview-box {
      background: #fff; border-radius: 8px; padding: 16px;
      width: 420px; text-align: center; position: relative;
    }
    .preview-box .pv-img {
      width: 100%; aspect-ratio: 3/4; border-radius: 6px; overflow: hidden;
      position: relative; background: #26262A;
    }
    .preview-box .pv-img .photo-bg { position: absolute; inset: 0; }
    .preview-box .pv-img .photo-person {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
      width: 60%; aspect-ratio: 3/4; border-radius: 8px; z-index: 2;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .preview-box .pv-meta { font-size: 13px; color: #666; margin-top: 12px; text-align: left; line-height: 1.8; }
    .preview-box .pv-close { position: absolute; top: 10px; right: 14px; font-size: 20px; cursor: pointer; color: #999; }
    .preview-box .pv-close:hover { color: #333; }
    .batch-bar { display: none; margin: 0 0 12px; }
    .batch-bar .filter-btn.danger { background: #f5222d; border-color: #f5222d; color: #fff; }
  </style>

  <div class="stat-cards">
    <div class="stat-card"><div class="sc-num" id="stat-total">0</div><div class="sc-label">全部照片</div></div>
    <div class="stat-card"><div class="sc-num" id="stat-onscreen">0</div><div class="sc-label">展示中</div></div>
    <div class="stat-card"><div class="sc-num" id="stat-visitors">0</div><div class="sc-label">留影人数</div></div>
  </div>

  <div class="page-header">
    <div class="page-title">照片管理</div>
    <div>
      <button class="toolbar-btn" id="btn-batch" onclick="batchSelect()">批量选择</button>
      <button class="toolbar-btn" id="btn-batch-done" style="display:none" onclick="batchDone()">完成</button>
    </div>
  </div>

  <div class="filter-bar">
    <div class="filter-item">
      <span class="filter-label">展示状态</span>
      <select class="filter-select" id="f-on-screen" onchange="applyFilter()">
        <option value="">全部</option>
        <option value="onscreen">展示中</option>
        <option value="off">未展示</option>
      </select>
    </div>
    <div class="filter-item">
      <span class="filter-label">模板</span>
      <select class="filter-select" id="f-tpl" onchange="applyFilter()">
        <option value="">全部</option>
        <option value="党旗礼赞">党旗礼赞</option>
        <option value="工笔华章">工笔华章</option>
        <option value="盛会留念框">盛会留念框</option>
        <option value="盛世华章">盛世华章</option>
        <option value="水墨山河">水墨山河</option>
        <option value="古田星火">古田星火</option>
        <option value="福见山海">福见山海</option>
        <option value="奋进新征程">奋进新征程</option>
      </select>
    </div>
    <div class="filter-item">
      <button class="filter-btn primary" onclick="applyFilter()">查询</button>
      <button class="filter-btn" onclick="resetFilter()">重置</button>
    </div>
  </div>

  <div class="batch-bar" id="batch-bar">
    <span>已选 <b id="batch-count">0</b> 张</span>
    <button class="filter-btn danger" onclick="batchDelete()">批量删除</button>
  </div>

  <div class="table-card">
    <table class="photo-tbl" id="photo-table">
      <thead>
        <tr>
          <th class="td-check"></th>
          <th class="thumb-cell">纪念照</th>
          <th>编号</th>
          <th>模板</th>
          <th>微信号</th>
          <th>来源屏幕</th>
          <th>生成状态</th>
          <th>AI 初审</th>
          <th>展示状态</th>
          <th>创建时间</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="photo-tbody"></tbody>
    </table>
  </div>
  <div class="pagination">
    <div class="page-info" id="page-info"></div>
    <div class="page-btns">
      <button class="page-btn" onclick="prevPage()">‹</button>
      <span class="page-btn active" id="page-num">1</span>
      <button class="page-btn" onclick="nextPage()">›</button>
    </div>
  </div>

  <!-- 大图预览 -->
  <div class="preview-overlay" id="preview-overlay" onclick="closePreview()">
    <div class="preview-box" onclick="event.stopPropagation()">
      <span class="pv-close" onclick="closePreview()">×</span>
      <div class="pv-img" id="pv-img"></div>
      <div class="pv-meta" id="pv-meta"></div>
    </div>
  </div>

  <div id="toast-area"></div>
</div>

<script>
/* ================= 照片管理（B 端总台账） ================= */
var PHOTO_LIST = [
  { no: 'FJDH-0328-01', wx: '138****0328', tpl: '党旗礼赞', screen: '主会场 · 屏1', gen: '成功', ai: '通过', on: true,  time: '09-30 10:21' },
  { no: 'FJDH-0328-02', wx: '138****0328', tpl: '工笔华章', screen: '主会场 · 屏1', gen: '成功', ai: '通过', on: false, time: '09-30 10:23' },
  { no: 'FJDH-0002-01', wx: '139****8002', tpl: '盛会留念框', screen: '序厅 · 屏2', gen: '成功', ai: '通过', on: true,  time: '09-30 09:12' },
  { no: 'FJDH-0009-01', wx: '135****9009', tpl: '工笔华章', screen: '序厅 · 屏2', gen: '成功', ai: '通过', on: true,  time: '09-30 09:20' },
  { no: 'FJDH-0015-01', wx: '137****0015', tpl: '盛世华章', screen: '签到区 · 屏3', gen: '成功', ai: '存疑', on: false, time: '09-30 09:31' },
  { no: 'FJDH-0021-01', wx: '136****0021', tpl: '水墨山河', screen: '签到区 · 屏3', gen: '成功', ai: '通过', on: false, time: '09-30 09:44' },
  { no: 'FJDH-0033-01', wx: '139****0033', tpl: '盛会留念框', screen: '主会场 · 屏1', gen: '成功', ai: '通过', on: true,  time: '09-30 10:02' },
  { no: 'FJDH-0040-01', wx: '138****0040', tpl: '古田星火', screen: '序厅 · 屏2', gen: '成功', ai: '拦截', on: false, time: '09-30 10:08' },
  { no: 'FJDH-0052-01', wx: '135****0052', tpl: '福见山海', screen: '签到区 · 屏3', gen: '成功', ai: '通过', on: true,  time: '09-30 10:15' },
  { no: 'FJDH-0061-01', wx: '137****0061', tpl: 'Q版先锋', screen: '主会场 · 屏1', gen: '失败', ai: '—',    on: false, time: '09-30 10:17' },
  { no: 'FJDH-0068-01', wx: '136****0068', tpl: '奋进新征程', screen: '序厅 · 屏2', gen: '成功', ai: '通过', on: false, time: '09-30 10:26' },
  { no: 'FJDH-0077-01', wx: '139****0077', tpl: '工笔华章', screen: '签到区 · 屏3', gen: '成功', ai: '通过', on: false, time: '09-30 10:30' }
];

var MGMT_BATCH_MODE = false;
var MGMT_SELECTED = {};
var MGMT_PAGE = 1;
var MGMT_PAGE_SIZE = 8;

function getTplBgIdx(no) {
  var n = parseInt(no.replace(/\D/g, ''), 10) || 1;
  return (n % 8) + 1;
}
function capNameOf(tpl) {
  var map = { '党旗礼赞': '智能海报', '工笔华章': 'AI 艺术', '盛会留念框': '经典框', '盛世华章': '智能海报', '水墨山河': 'AI 艺术', '古田星火': '智能海报', '福见山海': '智能海报', 'Q版先锋': 'AI 艺术', '奋进新征程': '经典框' };
  return map[tpl] || '智能海报';
}
function renderStatCards() {
  var visitors = {};
  PHOTO_LIST.forEach(function(p) {
    var k = p.wx;
    if (!visitors[k]) visitors[k] = 1;
  });
  document.getElementById('stat-total').textContent = PHOTO_LIST.length;
  document.getElementById('stat-onscreen').textContent = PHOTO_LIST.filter(function(p){ return p.on; }).length;
  document.getElementById('stat-visitors').textContent = Object.keys(visitors).length;
}
function renderPhotoTable() {
  var tplF = document.getElementById('f-tpl').value;
  var osF = document.getElementById('f-on-screen').value;
  var list = PHOTO_LIST.filter(function(p) {
    if (osF === 'onscreen' && !p.on) return false;
    if (osF === 'off' && p.on) return false;
    if (tplF && p.tpl !== tplF) return false;
    return true;
  });
  var tbody = document.getElementById('photo-tbody');
  var start = (MGMT_PAGE - 1) * MGMT_PAGE_SIZE;
  var pageList = list.slice(start, start + MGMT_PAGE_SIZE);
  var html = '';
  pageList.forEach(function(p) {
    var bg = getTplBgIdx(p.no);
    var checked = MGMT_SELECTED[p.no] ? ' checked' : '';
    html += '<tr>' +
      '<td class="td-check"><input type="checkbox" class="row-check" data-no="' + p.no + '"' + checked + ' onclick="onRowCheck(this)"></td>' +
      '<td><span class="photo-thumb" onclick="openPreview(\'' + p.no + '\')">' +
        '<span class="pt-bg wb-' + bg + '"></span><span class="pt-person"></span></span></td>' +
      '<td>' + p.no + '</td>' +
      '<td>' + p.tpl + '</td>' +
      '<td>' + p.wx + '</td>' +
      '<td>' + p.screen + '</td>' +
      '<td><span class="badge-status ' + (p.gen === '成功' ? 'active' : 'disabled') + '">' + p.gen + '</span></td>' +
      '<td>' + aiBadge(p.ai) + '</td>' +
      '<td>' + onBadge(p.on) + '</td>' +
      '<td>' + p.time + '</td>' +
      '<td class="selection-cell">' + onAction(p) + '</td>' +
      '</tr>';
  });
  if (!pageList.length) {
    html = '<tr><td colspan="11" style="text-align:center;color:#999;padding:40px 0">暂无符合条件的照片</td></tr>';
  }
  tbody.innerHTML = html;
  document.getElementById('page-info').textContent = '共 ' + list.length + ' 张';
  document.getElementById('page-num').textContent = MGMT_PAGE;
  var batchBar = document.getElementById('batch-bar');
  var bc = Object.keys(MGMT_SELECTED).length;
  document.getElementById('batch-count').textContent = bc;
  if (MGMT_BATCH_MODE) {
    batchBar.style.display = 'block';
    document.querySelectorAll('.row-check').forEach(function(c) { c.style.display = 'inline-block'; });
  } else {
    batchBar.style.display = 'none';
    document.querySelectorAll('.row-check').forEach(function(c) { c.style.display = 'none'; });
  }
}
function aiBadge(ai) {
  if (ai === '通过') return '<span class="badge-status active">通过</span>';
  if (ai === '存疑') return '<span class="badge-status" style="background:#fff7e6;color:#d48806">存疑</span>';
  if (ai === '拦截') return '<span class="badge-status disabled">拦截</span>';
  return '<span class="badge-status disabled">—</span>';
}
function onBadge(on) {
  return on ? '<span class="badge-status active" style="background:#f6ffed;color:#52c41a">展示中</span>'
            : '<span class="badge-status disabled">未展示</span>';
}
function onAction(p) {
  return '<a class="action-btn" onclick="openPhotoDetail(\'' + p.no + '\')">详情</a>';
}
function showToast(msg) {
  var ta = document.getElementById('toast-area');
  ta.innerHTML = '<div class="toast" style="position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:2000;background:rgba(0,0,0,0.82);color:#fff;padding:12px 24px;border-radius:8px;font-size:14px">' + msg + '</div>';
  setTimeout(function(){ ta.innerHTML = ''; }, 1600);
}
function batchSelect() {
  MGMT_BATCH_MODE = true;
  document.getElementById('btn-batch').style.display = 'none';
  document.getElementById('btn-batch-done').style.display = 'inline-block';
  document.querySelectorAll('.row-check').forEach(function(c) { c.style.display = 'inline-block'; });
  renderPhotoTable();
}
function batchDone() {
  MGMT_BATCH_MODE = false;
  MGMT_SELECTED = {};
  document.getElementById('btn-batch').style.display = 'inline-block';
  document.getElementById('btn-batch-done').style.display = 'none';
  renderPhotoTable();
}
function onRowCheck(el) {
  var no = el.getAttribute('data-no');
  if (el.checked) MGMT_SELECTED[no] = true; else delete MGMT_SELECTED[no];
  document.getElementById('batch-count').textContent = Object.keys(MGMT_SELECTED).length;
}
function batchDelete() {
  var keys = Object.keys(MGMT_SELECTED);
  if (!keys.length) { showToast('请先勾选照片'); return; }
  if (!confirm('确定删除所选 ' + keys.length + ' 张照片记录吗？')) return;
  PHOTO_LIST = PHOTO_LIST.filter(function(p) { return !MGMT_SELECTED[p.no]; });
  MGMT_SELECTED = {};
  showToast('已删除 ' + keys.length + ' 张照片');
  renderStatCards();
  renderPhotoTable();
}
/* ---- 大图预览 ---- */
function openPreview(no) {
  var p = PHOTO_LIST.filter(function(x){ return x.no === no; })[0];
  if (!p) return;
  var bg = getTplBgIdx(p.no);
  var img = document.getElementById('pv-img');
  img.innerHTML = '<div class="photo-bg wb-' + bg + '"></div><div class="photo-person"></div>';
  document.getElementById('pv-meta').innerHTML =
    '<b>编号：</b>' + p.no + '<br><b>模板：</b>' + p.tpl + '（' + capNameOf(p.tpl) + '）<br>' +
    '<b>微信号：</b>' + p.wx + '　<b>来源：</b>' + p.screen + '　<b>提交时间：</b>' + p.time +
    '<br><span style="color:#999;font-size:12px">原型示意：正式版本展示真实生成图片</span>';
  document.getElementById('preview-overlay').classList.add('show');
}
function closePreview() { document.getElementById('preview-overlay').classList.remove('show'); }
/* ---- 筛选/分页 ---- */
function applyFilter() { MGMT_PAGE = 1; renderPhotoTable(); }
function resetFilter() {
  document.getElementById('f-on-screen').value = '';
  document.getElementById('f-tpl').value = '';
  MGMT_PAGE = 1;
  renderPhotoTable();
}
function prevPage() { if (MGMT_PAGE > 1) { MGMT_PAGE--; renderPhotoTable(); } }
function nextPage() { MGMT_PAGE++; renderPhotoTable(); }
function buildPhotoDetails() {
  window.__PHOTO_DETAILS = {};
  PHOTO_LIST.forEach(function(p) {
    var tpl = null;
    try { tpl = TPL_LIST ? TPL_LIST.filter(function(x){ return x.name === p.tpl; })[0] : null; } catch(e) {}
    window.__PHOTO_DETAILS[p.no] = {
      no: p.no, tpl: p.tpl, wx: p.wx, screen: p.screen,
      gen: p.gen, ai: p.ai, on: p.on, time: p.time,
      onTime: p.onTime || (p.on ? p.time : null),
      capName: tpl ? ({ A: '经典纪念框', B: '智能主题海报', C: 'AI 艺术创作' })[tpl.cap] : '—',
      groupName: tpl ? tpl.groupName : '—',
      uses: tpl ? tpl.uses : '—',
      bg: ((p.no.length + 3) % 8) + 1
    };
  });
}
function openPhotoDetail(no) {
  if (!window.__PHOTO_DETAILS) buildPhotoDetails();
  if (typeof window.pdShowDetail === 'function') window.pdShowDetail(no);
}
function init_photo_mgmt() { renderStatCards(); renderPhotoTable(); }
  buildPhotoDetails();
init_photo_mgmt();
</script>
