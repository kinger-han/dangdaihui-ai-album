<!-- PAGE_META: {"id": "photo-mgmt", "title": "照片管理"} -->
<div class="page" id="page-photo-mgmt">
  <style>
    /* 照片管理页局部样式（组件内 style 随页面注入保留） */
    .photo-tbl th, .photo-tbl td { text-align: left; }
    .photo-tbl .thumb-cell { width: 56px; }
    .photo-thumb {
      width: 44px; height: 58px; border-radius: 4px; overflow: hidden;
      position: relative; cursor: zoom-in; display: inline-block;
      background: #F0EAE0; vertical-align: middle;
    }
    .photo-thumb .pt-bg { position: absolute; inset: 0; }
    .photo-thumb .pt-person {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
      width: 55%; aspect-ratio: 3/4; border-radius: 3px; z-index: 2;
      background: linear-gradient(135deg, #F5D0A9, #D9A066);
      border: 1.5px solid rgba(255,255,255,0.8);
    }
    /* V2.1 画风衍生：列表缩略带滤镜 + 组角标 */
    .photo-thumb.effect-guangying .pt-bg, .photo-thumb.effect-guangying .pt-person { filter: brightness(1.08) contrast(1.06); }
    .photo-thumb.effect-shuimo    .pt-bg, .photo-thumb.effect-shuimo    .pt-person { filter: grayscale(0.55) sepia(0.35) contrast(0.98); }
    .photo-thumb.effect-shouhui  .pt-bg, .photo-thumb.effect-shouhui  .pt-person { filter: saturate(0.45) contrast(1.12); }
    .photo-thumb.effect-hongchou  .pt-bg, .photo-thumb.effect-hongchou  .pt-person { filter: sepia(0.22) saturate(1.12) contrast(1.04); }
    .tag-c { display: inline-block; margin: 2px 4px 2px 0; padding: 1px 8px; font-size: 11px; border-radius: 3px; line-height: 1.5; }
    .tag-c.origin { color: #1677ff; background: #e6f4ff; border: 1px solid #91caff; }
    .tag-c.style { color: #8a641e; background: #fdf6e3; border: 1px solid #eadfc4; }
    .pv-img.effect-guangying .photo-bg, .pv-img.effect-guangying .photo-person { filter: brightness(1.08) contrast(1.06); }
    .pv-img.effect-shuimo    .photo-bg, .pv-img.effect-shuimo    .photo-person { filter: grayscale(0.55) sepia(0.35) contrast(0.98); }
    .pv-img.effect-shouhui  .photo-bg, .pv-img.effect-shouhui  .photo-person { filter: saturate(0.45) contrast(1.12); }
    .pv-img.effect-hongchou  .photo-bg, .pv-img.effect-hongchou  .photo-person { filter: sepia(0.22) saturate(1.12) contrast(1.04); }

    .td-check { width: 36px; }
    .selection-cell .badge-status { margin-right: 4px; }
    /* 统计看板 */
    .stat-cards { display: flex; gap: 12px; margin-bottom: 14px; }
    .stat-card {
      flex: 1; background: #fff; border: 1px solid #eee; border-radius: 6px;
      padding: 14px 16px; display: flex; align-items: center; gap: 12px;
    }
    .stat-card .sc-num { font-size: 24px; font-weight: 700; color: #0B5DEA; }
    .stat-card .sc-label { font-size: 13px; color: #666; }
    /* 大图预览 */
    .preview-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000;
      display: none; align-items: center; justify-content: center;
    }
    .preview-overlay.show { display: flex; }
    .preview-box {
      background: #fff; border-radius: 8px; padding: 16px;
      width: 420px; text-align: center; position: relative;
    }
    .preview-box .pv-img {
      width: 100%; aspect-ratio: 3/4; border-radius: 6px; overflow: hidden;
      position: relative; background: #26262A;
    }
    .preview-box .pv-img .photo-bg { position: absolute; inset: 0; }
    .preview-box .pv-img .photo-person {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
      width: 60%; aspect-ratio: 3/4; border-radius: 8px; z-index: 2;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .preview-box .pv-meta { font-size: 13px; color: #666; margin-top: 12px; text-align: left; line-height: 1.8; }
    .preview-box .pv-close { position: absolute; top: 10px; right: 14px; font-size: 20px; cursor: pointer; color: #999; }
    .preview-box .pv-close:hover { color: #333; }
    .batch-bar { display: none; margin: 0 0 12px; }
    .batch-bar .filter-btn.danger { background: #f5222d; border-color: #f5222d; color: #fff; }
  </style>

  <div class="stat-cards">
    <div class="stat-card"><div class="sc-num" id="stat-total">0</div><div class="sc-label">纪念照片数</div></div>
    <div class="stat-card"><div class="sc-num" id="stat-onscreen">0</div><div class="sc-label">分享上屏人数</div></div>
    <div class="stat-card"><div class="sc-num" id="stat-visitors">0</div><div class="sc-label">留下纪念人数</div></div>
  </div>

  <div class="filter-bar">
    <div class="filter-item">
      <select class="filter-select" id="f-cust" onchange="photoSyncActivityFilter()"></select>
    </div>
    <div class="filter-item">
      <select class="filter-select" id="f-act" onchange="photoSyncScreenFilters(); applyFilter()"></select>
    </div>
    <div class="filter-item">
      <span class="filter-label">状态</span>
      <select class="filter-select" id="f-on-screen" onchange="applyFilter()">
        <option value="">全部</option>
        <option value="selected">正在展示</option>
        <option value="wait">等待上屏</option>
        <option value="notsub">暂未分享</option>

    </div>
    <div class="filter-item">
      <span class="filter-label">模板</span>
      <select class="filter-select" id="f-tpl" onchange="applyFilter()">
        <option value="">全部</option>
        <option value="党旗礼赞">党旗礼赞</option>
        <option value="工笔华章">工笔华章</option>
        <option value="盛会留念框">盛会留念框</option>
        <option value="盛世华章">盛世华章</option>
        <option value="水墨山河">水墨山河</option>
        <option value="古田星火">古田星火</option>
        <option value="福见山海">福见山海</option>
        <option value="Q版先锋">Q版先锋</option>
        <option value="奋进新征程">奋进新征程</option>
      </select>
    </div>
    <div class="filter-item">
      <span class="filter-label">照片方向</span>
      <select class="filter-select" id="f-dir" onchange="applyFilter()">
        <option value="">全部</option>
        <option value="竖屏">竖屏</option>
        <option value="横屏">横屏</option>

    </div>
    <div class="filter-item">
      <span class="filter-label">来源屏幕</span>
      <select class="filter-select" id="f-src-screen" onchange="applyFilter()"></select>
    </div>
    <div class="filter-item">
      <span class="filter-label">上屏屏幕</span>
      <select class="filter-select" id="f-on-screen-dev" onchange="applyFilter()"></select>
    </div>
    <div class="filter-item">
      <input class="filter-input" id="f-photo-no" placeholder="请输入照片编号" oninput="applyFilter()">
    </div>
    <div class="filter-item">
      <button class="filter-btn" onclick="resetFilter()">重置</button>
      <button class="filter-btn search" onclick="applyFilter()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>搜索</button>
      <button class="filter-btn danger" onclick="batchDelete()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>批量删除</button>
    </div>
  </div>

  <div class="batch-bar" id="batch-bar">
    <span>已选 <b id="batch-count">0</b> 张</span>
  </div>

  <div class="table-card">
    <table class="photo-tbl" id="photo-table">
      <thead>
        <tr>
          <th class="td-check"></th>
          <th class="thumb-cell">纪念照</th>
          <th>编号</th>
          <th>所属活动</th>
          <th>所属客户</th>
          <th>模板</th>
          <th>画风</th>
          <th>账号</th>
          <th>上屏屏幕</th>
          <th>来源屏幕</th>
          <th>上屏状态</th>
          <th>创建时间</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="photo-tbody"></tbody>
    </table>
    <div class="pagination" id="photo-pager"></div>
  </div>

  <!-- 大图预览 -->
  <div class="preview-overlay" id="preview-overlay" onclick="closePreview()">
    <div class="preview-box" onclick="event.stopPropagation()">
      <span class="pv-close" onclick="closePreview()">×</span>
      <div class="pv-img" id="pv-img"></div>
      <div class="pv-meta" id="pv-meta"></div>
    </div>
  </div>

  <div id="toast-area"></div>
</div>

<script>
/* ================= 照片管理（B 端总台账） =================
   照片的归属是「生成时快照」：screenId = 来源设备记录 id，actId = 该设备记录所属活动。
   设备记录后来改投别的活动，历史照片的 actId 不变（快照不是实时 join）。 */
function _pStyleName(id) { var s = (window.__STYLE_LIST || []).filter(function(x){ return x.id === id; })[0]; return s ? s.name : id; }
function _pDevName(id) { var d = (window.__DEVICE_LIST || []).filter(function(x){ return x.id === id; })[0]; return d ? d.name : '—'; }
function _pActName(id) { return id ? (pcActivityName(id) || '—') : ''; }
function _pCustName(actId) { return actId ? (pcActivityCustomerName(actId) || '') : ''; }
var PHOTO_LIST = [
  { no: 'FJDH-0328-01', wx: '138****0328', tpl: '党旗礼赞',   screenId: 'dev1', onScreen: 'dev2',            on: true,  status: 'selected', time: '2026-09-30 10:21:05', onTime: '2026-09-30 10:22:11', offTime: null },
  { no: 'FJDH-0328-02', wx: '138****0328', tpl: '工笔华章',   screenId: 'dev1', onScreen: '',               on: false, status: 'notsub',   time: '2026-09-30 10:23:40', onTime: null, offTime: null },
  { no: 'FJDH-0002-01', wx: '139****8002', tpl: '盛会留念框', screenId: 'dev2', onScreen: 'dev1、dev2',      on: true,  status: 'selected', time: '2026-09-30 09:12:18', onTime: '2026-09-30 09:13:02', offTime: null },
  { no: 'FJDH-0002-02', wx: '139****8002', tpl: '盛会留念框', screenId: 'dev2', onScreen: '',               on: false, status: 'wait',     time: '2026-09-30 09:26:51', onTime: null, offTime: null, sourceWorkId: 'FJDH-0002-01', styleId: 'shuimo' },
  { no: 'FJDH-0002-03', wx: '139****8002', tpl: '盛会留念框', screenId: 'dev2', onScreen: '',               on: false, status: 'notsub',   time: '2026-09-30 09:32:07', onTime: null, offTime: null, sourceWorkId: 'FJDH-0002-01', styleId: 'guangying' },
  { no: 'FJDH-0009-01', wx: '135****9009', tpl: '工笔华章',   screenId: 'dev2', onScreen: 'dev2',            on: true,  status: 'selected', time: '2026-09-30 09:20:33', onTime: '2026-09-30 09:21:10', offTime: null },
  { no: 'FJDH-0015-01', wx: '137****0015', tpl: '盛世华章',   screenId: 'dev1', onScreen: '',               on: false, status: 'wait',     time: '2026-09-30 09:31:26', onTime: null, offTime: '2026-09-30 09:58:44' },
  { no: 'FJDH-0021-01', wx: '136****0021', tpl: '水墨山河',   screenId: 'dev2', onScreen: '',               on: false, status: 'wait',     time: '2026-09-30 09:44:12', onTime: null, offTime: null },
  { no: 'FJDH-0033-01', wx: '139****0033', tpl: '盛会留念框', screenId: 'dev1', onScreen: 'dev1',            on: true,  status: 'selected', time: '2026-09-30 10:02:55', onTime: '2026-09-30 10:03:20', offTime: null },
  { no: 'FJDH-0040-01', wx: '138****0040', tpl: '古田星火',   screenId: 'dev2', onScreen: '',               on: false, status: 'notsub',   time: '2026-09-30 10:08:41', onTime: null, offTime: null },
  { no: 'FJDH-0052-01', wx: '135****0052', tpl: '福见山海',   screenId: 'dev2', onScreen: 'dev2',            on: true,  status: 'selected', time: '2026-09-30 10:15:09', onTime: '2026-09-30 10:16:31', offTime: null },
  { no: 'FJDH-0061-01', wx: '137****0061', tpl: 'Q版先锋',    screenId: 'dev1', onScreen: '',               on: false, status: 'notsub',   time: '2026-09-30 10:17:22', onTime: null, offTime: null },
  { no: 'FJDH-0068-01', wx: '136****0068', tpl: '奋进新征程', screenId: 'dev2', onScreen: '',               on: false, status: 'wait',     time: '2026-09-30 10:26:38', onTime: null, offTime: '2026-09-30 11:02:15' },
  { no: 'FJDH-0077-01', wx: '139****0077', tpl: '工笔华章',   screenId: 'dev2', onScreen: '',               on: false, status: 'wait',     time: '2026-09-30 10:30:14', onTime: null, offTime: null },
  { no: 'FZWA-0101-01', wx: '137****0101', tpl: '党旗礼赞',   screenId: 'dev3', onScreen: 'dev3',            on: true,  status: 'selected', time: '2026-09-29 15:12:08', onTime: '2026-09-29 15:13:20', offTime: null },
  { no: 'FZWA-0101-02', wx: '137****0101', tpl: '水墨山河',   screenId: 'dev3', onScreen: '',               on: false, status: 'wait',     time: '2026-09-29 15:19:44', onTime: null, offTime: null, sourceWorkId: 'FZWA-0101-01', styleId: 'shouhui' },
  { no: 'FZWA-0102-01', wx: '136****0102', tpl: '工笔华章',   screenId: 'dev4', onScreen: '',               on: false, status: 'notsub',   time: '2026-09-29 15:24:10', onTime: null, offTime: null },
  { no: 'FZWA-0103-01', wx: '138****0103', tpl: '古田星火',   screenId: 'dev4', onScreen: 'dev4',            on: true,  status: 'selected', time: '2026-09-29 15:41:02', onTime: '2026-09-29 15:42:11', offTime: null },
  { no: 'XMZG-0201-01', wx: '139****0201', tpl: '福见山海',   screenId: 'dev5', onScreen: 'dev5',            on: true,  status: 'selected', time: '2026-08-20 11:05:30', onTime: '2026-08-20 11:06:40', offTime: null },
  { no: 'XMZG-0201-02', wx: '139****0201', tpl: '盛世华章',   screenId: 'dev5', onScreen: '',               on: false, status: 'wait',     time: '2026-08-20 11:12:55', onTime: null, offTime: null },
  { no: 'XMZG-0202-01', wx: '135****0202', tpl: '奋进新征程', screenId: 'dev5', onScreen: '',               on: false, status: 'notsub',   time: '2026-08-20 11:18:03', onTime: null, offTime: null },
  { no: 'QZHX-0301-01', wx: '137****0301', tpl: '盛会留念框', screenId: 'dev6', onScreen: '',               on: false, status: 'notsub',   time: '2026-10-08 10:06:20', onTime: null, offTime: null }
];
/* 照片归属活动 = 来源设备记录当时的所属活动（快照） */
function _pActOf(p) {
  if (p.actId) return p.actId;
  var d = (window.__DEVICE_LIST || []).filter(function(x){ return x.id === p.screenId; })[0];
  return d ? (d.actId || '') : '';
}
function _pOnScreenText(p) {
  if (!p.onScreen) return '—';
  var ids = String(p.onScreen).split(',').filter(Boolean);
  var names = ids.map(function(id){ return _pDevName(id); });
  return names.length ? names.join('、') : '—';
}

var MGMT_SELECTED = {};
var MGMT_PAGE = 1;
var MGMT_PAGE_SIZE = 10;

function getTplBgIdx(no) {
  var p = (PHOTO_LIST||[]).filter(function(x){ return x.no === no; })[0];
  if (p && p.sourceWorkId) return getTplBgIdx(p.sourceWorkId);
  var n = parseInt(no.replace(/\D/g, ''), 10) || 1;
  return (n % 8) + 1;
}
function capNameOf(tpl) {
  var map = { '党旗礼赞': '智能海报', '工笔华章': 'AI 艺术', '盛会留念框': '经典框', '盛世华章': '智能海报', '水墨山河': 'AI 艺术', '古田星火': '智能海报', '福见山海': '智能海报', 'Q版先锋': 'AI 艺术', '奋进新征程': '经典框' };
  return map[tpl] || '智能海报';
}
/* ---- 筛选下拉：客户 → 活动级联 ---- */
function photoFillFilters() {
  var cEl = document.getElementById('f-cust');
  var cOpts = '<option value="">全部客户</option>';
  (window.__CUSTOMER_LIST || []).forEach(function(c) {
    if (c.enabled === false) return;
    cOpts += '<option value="' + c.id + '">' + c.name + '</option>';
  });
  cEl.innerHTML = cOpts;
  photoSyncActivityFilter();
}
function photoSyncActivityFilter() {
  var custId = document.getElementById('f-cust').value;
  var aEl = document.getElementById('f-act');
  var aOpts = '<option value="">全部活动</option>';
  (window.__ACTIVITY_LIST || []).forEach(function(a) {
    if (custId && a.customerId !== custId) return;
    aOpts += '<option value="' + a.id + '">' + a.name + '</option>';
  });
  aEl.innerHTML = aOpts;
  photoSyncScreenFilters();
  renderPhotoTable();
}
/* 来源屏幕 / 上屏屏幕 下拉：随已选活动收窄（活动级联） */
function photoSyncScreenFilters() {
  var actF = document.getElementById('f-act').value;
  var devs = (window.__DEVICE_LIST || []).filter(function(d) {
    return !actF || d.actId === actF;
  });
  var opts = '<option value="">全部</option>';
  devs.forEach(function(d) {
    var label = d.name;
    if (d.actId) {
      var a = pcActivityOf(d.actId);
      if (a) label += '（' + a.shortName + '）';
    }
    opts += '<option value="' + d.id + '">' + label + '</option>';
  });
  var a = document.getElementById('f-src-screen'), b = document.getElementById('f-on-screen-dev');
  if (a) a.innerHTML = opts;
  if (b) b.innerHTML = opts;
}
/* 照片筛选：客户 / 活动 / 来源屏幕 / 上屏屏幕 */
function photoMatchFilter(p) {
  var custF = document.getElementById('f-cust').value;
  var actF  = document.getElementById('f-act').value;
  var actId = _pActOf(p);
  if (custF) {
    var a = actId ? pcActivityOf(actId) : null;
    if (!a || a.customerId !== custF) return false;
  }
  if (actF && actId !== actF) return false;
  return true;
}
function renderStatCards(list) {
  var base = list || PHOTO_LIST;
  var visitors = {}, onPeople = {};
  base.forEach(function(p) {
    visitors[p.wx] = 1;
    if (p.status === 'selected') onPeople[p.wx] = 1;
  });
  document.getElementById('stat-total').textContent = base.length;
  document.getElementById('stat-onscreen').textContent = Object.keys(onPeople).length;
  document.getElementById('stat-visitors').textContent = Object.keys(visitors).length;
}
var TPL_DIR = { '盛会留念框': '横屏' };
function dirOfTpl(tpl) { return TPL_DIR[tpl] || '竖屏'; }
function renderPhotoTable() {
  var osF  = document.getElementById('f-on-screen').value;
  var tplF = document.getElementById('f-tpl').value;
  var dirF = document.getElementById('f-dir').value;
  var srcF = document.getElementById('f-src-screen').value;
  var onF  = document.getElementById('f-on-screen-dev').value;
  var noF  = (document.getElementById('f-photo-no').value || '').trim();
  var list = PHOTO_LIST.filter(function(p) {
    if (!photoMatchFilter(p)) return false;
    if (osF && p.status !== osF) return false;
    if (tplF && p.tpl !== tplF) return false;
    if (dirF && dirOfTpl(p.tpl) !== dirF) return false;
    if (srcF && p.screenId !== srcF) return false;
    if (onF) {
      var ids = p.onScreen ? String(p.onScreen).split(',') : [];
      if (ids.indexOf(onF) < 0) return false;
    }
    if (noF && p.no.indexOf(noF) < 0) return false;
    return true;
  });
  /* 默认按创建时间倒序 */
  list = list.slice().sort(function(a, b) { return a.time < b.time ? 1 : (a.time > b.time ? -1 : 0); });
  var tbody = document.getElementById('photo-tbody');
  var start = (MGMT_PAGE - 1) * MGMT_PAGE_SIZE;
  var pageList = list.slice(start, start + MGMT_PAGE_SIZE);
  var html = '';
  pageList.forEach(function(p) {
    var bg = getTplBgIdx(p.no);
    var checked = MGMT_SELECTED[p.no] ? ' checked' : '';
    var eff = p.styleId ? (' effect-' + p.styleId) : '';
    var actId = _pActOf(p);
    html += '<tr>' +
      '<td class="td-check"><input type="checkbox" class="row-check" data-no="' + p.no + '"' + checked + ' onclick="onRowCheck(this)"></td>' +
      '<td><span class="photo-thumb' + eff + '" onclick="openPreview(\'' + p.no + '\')">' +
        '<span class="pt-bg wb-' + bg + '"></span><span class="pt-person"></span></span></td>' +
      '<td>' + p.no + '</td>' +
      '<td>' + (actId ? _pActName(actId) : '<span style="color:#999">—</span>') + '</td>' +
      '<td>' + (actId ? _pCustName(actId) : '<span style="color:#999">—</span>') + '</td>' +
      '<td>' + p.tpl + '</td>' +
      '<td>' + styleTagsOf(p) + '</td>' +
      '<td>' + p.wx + '</td>' +
      '<td>' + _pOnScreenText(p) + '</td>' +
      '<td>' + _pDevName(p.screenId) + '</td>' +
      '<td>' + statusBadge(p.status) + '</td>' +
      '<td>' + p.time + '</td>' +
      '<td class="selection-cell">' + onAction(p) + '</td>' +
      '</tr>';
  });
  if (!pageList.length) {
    html = '<tr><td colspan="13" style="text-align:center;color:#999;padding:40px 0">暂无符合条件的照片</td></tr>';
  }
  tbody.innerHTML = html;
  window.__PAGER['photo-pager'] = function(pg) { MGMT_PAGE = pg; renderPhotoTable(); };
  renderPager('photo-pager', list.length, MGMT_PAGE, MGMT_PAGE_SIZE);
  renderStatCards(list);
  var bc = Object.keys(MGMT_SELECTED).length;
  document.getElementById('batch-count').textContent = bc;
  var batchBar = document.getElementById('batch-bar');
  if (bc > 0) batchBar.style.display = 'block'; else batchBar.style.display = 'none';
}
function statusBadge(st) {
  if (st === 'selected') return '<span class="badge-status active" style="background:#f6ffed;color:#52c41a">正在展示</span>';
  if (st === 'wait')    return '<span class="badge-status" style="background:#e6f4ff;color:#1677ff">等待上屏</span>';
  return '<span class="badge-status disabled">暂未分享</span>';
}
/* 画风列：每行单值（原图 / 画风名）；风格照片为独立数据行 */
function styleTagsOf(p) {
  if (p.styleId) return '<span class="tag-c style">' + _pStyleName(p.styleId) + '</span>';
  return '<span class="tag-c origin">原图</span>';
}
function onAction(p) {
  return '<a class="action-btn" onclick="openPhotoDetail(\'' + p.no + '\')">详情</a>' +
    '<a class="action-btn danger" onclick="delPhoto(\'' + p.no + '\')">删除</a>';
}
/* 单行删除：原图删除时其风格衍生照一并删除（与批量删除一致） */
function delPhoto(no) {
  var p = PHOTO_LIST.filter(function(x){ return x.no === no; })[0];
  if (!p) return;
  var tip = p.sourceWorkId ? '确定删除风格照 ' + no + ' 吗？' : '确定删除照片 ' + no + ' 吗？其风格衍生照将一并删除。';
  if (!confirm(tip)) return;
  PHOTO_LIST = PHOTO_LIST.filter(function(x){ return x.no !== no && x.sourceWorkId !== no; });
  showToast('已删除 ' + no);
  renderPhotoTable();
}
function showToast(msg) {
  var ta = document.getElementById('toast-area');
  ta.innerHTML = '<div class="toast" style="position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:2000;background:rgba(0,0,0,0.82);color:#fff;padding:12px 24px;border-radius:8px;font-size:14px">' + msg + '</div>';
  setTimeout(function(){ ta.innerHTML = ''; }, 1600);
}
function onRowCheck(el) {
  var no = el.getAttribute('data-no');
  if (el.checked) MGMT_SELECTED[no] = true; else delete MGMT_SELECTED[no];
  document.getElementById('batch-count').textContent = Object.keys(MGMT_SELECTED).length;
}
function batchDelete() {
  var keys = Object.keys(MGMT_SELECTED);
  if (!keys.length) { showToast('请先勾选照片'); return; }
  if (!confirm('确定删除所选 ' + keys.length + ' 张照片记录吗？（原图被删除时其风格衍生一并删除）')) return;
  PHOTO_LIST = PHOTO_LIST.filter(function(p) {
    if (MGMT_SELECTED[p.no]) return false;
    if (p.sourceWorkId && MGMT_SELECTED[p.sourceWorkId]) return false;
    return true;
  });
  MGMT_SELECTED = {};
  showToast('已删除 ' + keys.length + ' 张照片');
  buildPhotoDetails();
  renderPhotoTable();
}
/* ---- 大图预览 ---- */
function openPreview(no) {
  var p = PHOTO_LIST.filter(function(x){ return x.no === no; })[0];
  if (!p) return;
  var bg = getTplBgIdx(p.no);
  var img = document.getElementById('pv-img');
  img.className = 'pv-img' + (p.styleId ? (' effect-' + p.styleId) : '');
  img.innerHTML = '<div class="photo-bg wb-' + bg + '"></div><div class="photo-person"></div>';
  var styleTxt = p.styleId ? '　<b>画风：</b>' + _pStyleName(p.styleId) : '';
  var actId = _pActOf(p);
  document.getElementById('pv-meta').innerHTML =
    '<b>编号：</b>' + p.no + '<br><b>模板：</b>' + p.tpl + '（' + capNameOf(p.tpl) + '）' + styleTxt + '<br>' +
    '<b>所属活动：</b>' + (actId ? _pActName(actId) : '—') + '　<b>所属客户：</b>' + (actId ? _pCustName(actId) : '—') + '<br>' +
    '<b>账号：</b>' + p.wx + '　<b>来源屏幕：</b>' + _pDevName(p.screenId) + '　<b>创建时间：</b>' + p.time;
  document.getElementById('preview-overlay').classList.add('show');
}
function closePreview() { document.getElementById('preview-overlay').classList.remove('show'); }
/* ---- 筛选/分页 ---- */
function applyFilter() { MGMT_PAGE = 1; renderPhotoTable(); }
function resetFilter() {
  document.getElementById('f-cust').value = '';
  document.getElementById('f-act').value = '';
  document.getElementById('f-on-screen').value = '';
  document.getElementById('f-tpl').value = '';
  document.getElementById('f-dir').value = '';
  document.getElementById('f-src-screen').value = '';
  document.getElementById('f-on-screen-dev').value = '';
  document.getElementById('f-photo-no').value = '';
  MGMT_SELECTED = {};
  MGMT_PAGE = 1;
  photoSyncScreenFilters();
  renderPhotoTable();
}
function buildPhotoDetails() {
  window.__PHOTO_DETAILS = {};
  PHOTO_LIST.forEach(function(p) {
    var root = p;
    if (p.sourceWorkId) { var r = PHOTO_LIST.filter(function(x){ return x.no === p.sourceWorkId; })[0]; if (r) root = r; }
    var actId = _pActOf(p);
    window.__PHOTO_DETAILS[p.no] = {
      no: p.no, tpl: p.tpl, wx: p.wx, screen: _pDevName(p.screenId),
      activity: actId ? _pActName(actId) : '—',
      customer: actId ? _pCustName(actId) : '—',
      styleName: p.styleId ? _pStyleName(p.styleId) : '原图',
      onScreen: _pOnScreenText(p),
      status: p.status || (p.on ? 'selected' : 'notsub'), time: p.time,
      onTime: p.onTime || (p.on ? p.time : null),
      offTime: p.offTime || null,
      sourceWorkId: p.sourceWorkId || '',
      styleId: p.styleId || '',
      bg: ((root.no.length + 3) % 8) + 1
    };
  });
}
function openPhotoDetail(no) {
  buildPhotoDetails();
  if (typeof window.pdShowDetail === 'function') window.pdShowDetail(no);
}
function init_photo_mgmt() { photoFillFilters(); renderPhotoTable(); }
  buildPhotoDetails();
init_photo_mgmt();
</script>
