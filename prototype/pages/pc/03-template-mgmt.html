<!-- PAGE_META: {"id": "template-mgmt", "title": "模板管理"} -->
<div class="page" id="page-template-mgmt">
  <style>
    /* 模板管理页局部样式 */
    .tpl-tbl th { text-align: left; }
    .tpl-tbl .tpl-thumb-cell { width: 60px; }
    .tpl-thumb {
      width: 44px; height: 58px; border-radius: 4px; overflow: hidden;
      position: relative; display: inline-block; background: #F0EAE0; vertical-align: middle;
    }
    .tpl-thumb .pt-bg2 { position: absolute; inset: 0; }
    .tpl-thumb .pt-person2 {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
      width: 55%; aspect-ratio: 3/4; border-radius: 3px; z-index: 2;
      background: linear-gradient(135deg, #F5D0A9, #D9A066);
      border: 1.5px solid rgba(255,255,255,0.8);
    }
    .tpl-leaf { font-size: 13px; color: #666; }
        .tpl-state-tag {
      display: inline-block; padding: 2px 10px; border-radius: 3px; font-size: 12px;
    }
    .tpl-state-tag.s-on { color: #52c41a; background: #f6ffed; }
    .tpl-state-tag.s-off { color: #999; background: #f5f5f5; }
    .action-link { color: #1677ff; cursor: pointer; margin-right: 12px; font-size: 13px; }
    .action-link.warn { color: #C0392B; }
    /* 模板新增/编辑弹窗 */
    .tpl-modal { position: fixed; inset: 0; z-index: 1300; display: none; align-items: center; justify-content: center; }
    .tpl-modal-mask { position: absolute; inset: 0; background: rgba(0,0,0,0.45); }
    .tpl-modal-box { position: relative; background: #fff; border-radius: 8px; width: 640px; max-height: 86vh; overflow-y: auto; padding: 20px 24px; box-shadow: 0 8px 32px rgba(0,0,0,0.15); }
    .tpl-modal-title { font-size: 15px; font-weight: 600; color: #333; margin-bottom: 16px; }
    .tf-row { display: flex; gap: 16px; margin-bottom: 14px; }
    .tf-field { flex: 1; min-width: 0; }
    .tf-label { font-size: 13px; color: #333; margin-bottom: 6px; display: block; }
    .tf-label .req { color: #ff4d4f; margin-left: 2px; }
    .tf-input { width: 100%; height: 36px; padding: 0 12px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 14px; outline: none; box-sizing: border-box; }
    .tf-input:focus { border-color: #1677ff; box-shadow: 0 0 0 2px rgba(22,119,255,0.1); }
    .tf-tip { font-size: 12px; color: #999; margin-top: 4px; }
    .tpl-modal-footer { display: flex; justify-content: flex-end; gap: 12px; margin-top: 20px; padding-top: 16px; border-top: 1px solid #f0f0f0; }
    /* 模板图片上传 */
    .tpl-img-row { display: flex; align-items: flex-start; gap: 20px; margin-bottom: 16px; }
    .tpl-img-preview { width: 120px; height: 160px; border: 1px dashed #d9d9d9; border-radius: 4px; overflow: hidden; flex-shrink: 0; background: #fafafa; display: flex; align-items: center; justify-content: center; }
    .tpl-img-preview.has-img { border-style: solid; border-color: #e0e0e0; }
    .tpl-img-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .tpl-img-ph { width: 100%; height: 100%; background: linear-gradient(135deg,#F0EAE0 0%,#E8DFD0 100%); position: relative; }
    .tpl-img-ph::after { content: '模板图片'; position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); font-size: 12px; color: #b8a88f; }
    .tpl-img-ops { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
    .tpl-img-tip { font-size: 12px; color: #999; line-height: 1.6; margin-top: 4px; }
    /* 归属活动多选 */
    .tf-act-pick { display: flex; flex-wrap: wrap; gap: 8px 18px; padding: 10px 12px; border: 1px solid #d9d9d9; border-radius: 4px; max-height: 110px; overflow-y: auto; }
    .tf-act-pick label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #333; cursor: pointer; }
  </style>

  <div class="filter-bar">
    <div class="filter-item">
      <input class="filter-input" id="f-tpl-name" placeholder="请输入模板名称" oninput="renderTplMgmt()">
    </div>
    <div class="filter-item">
      <span class="filter-label">模板状态</span>
      <select class="filter-select" id="f-tpl-state" onchange="renderTplMgmt()">
        <option value="">全部</option>
        <option value="on">启用</option>
        <option value="off">停用</option>
      </select>
    </div>
    <div class="filter-item">
      <select class="filter-select" id="f-tpl-cust" onchange="tplSyncActivityFilter()"></select>
    </div>
    <div class="filter-item">
      <select class="filter-select" id="f-tpl-act" onchange="renderTplMgmt()"></select>
    </div>
    <div class="filter-item">
      <span class="filter-label">模板方向</span>
      <select class="filter-select" id="f-tpl-dir" onchange="renderTplMgmt()">
        <option value="">全部</option>
        <option value="竖屏">竖屏</option>
        <option value="横屏">横屏</option>
      </select>
    </div>
    <div class="filter-item">
      <button class="filter-btn" onclick="resetTplFilter()">重置</button>
      <button class="filter-btn search" onclick="renderTplMgmt()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>搜索</button>
      <button class="filter-btn primary" onclick="openTplModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>新建模板</button>
      <button class="filter-btn danger" onclick="batchDelTpl()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>批量删除</button>
    </div>
  </div>

  <div class="table-card">
    <table class="tpl-tbl">
      <thead>
        <tr>
          <th style="width:36px"><input type="checkbox" id="tpl-all" onchange="toggleAllTpl(this)"></th>
          <th class="tpl-thumb-cell">模板图片</th>
          <th>模板名称</th>
          <th>归属活动</th>
          <th>模板方向</th>
          <th>适用建议</th>
          <th>状态</th>
          <th>使用次数</th>
          <th>更新时间</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="tpl-tbody"></tbody>
    </table>
    <div class="pagination" id="tpl-pager"></div>
  </div>

  <!-- 模板新增/编辑弹窗 -->
  <div class="tpl-modal" id="tpl-modal" style="display:none">
    <div class="tpl-modal-mask" onclick="closeTplModal()"></div>
    <div class="tpl-modal-box">
      <div class="tpl-modal-title" id="tpl-modal-title">新增模板</div>
      <div class="tpl-modal-body">
        <div class="tpl-img-row">
          <div class="tpl-img-preview" id="tpl-img-preview">
            <div class="tpl-img-ph"></div>
          </div>
          <div class="tpl-img-ops">
            <button class="dv-btn" onclick="document.getElementById('tpl-img-file').click()">上传图片</button>
            <button class="dv-btn" onclick="tplRemoveImg()">移除</button>
            <div class="tpl-img-tip">建议控制在 2MB 内，移动端模板卡片使用该图片</div>
            <input type="file" id="tpl-img-file" accept="image/*" style="display:none" onchange="tplImgChosen(this)">
          </div>
        </div>
        <div class="tf-row">
          <div class="tf-field">
            <label class="tf-label">模板名称 <span class="req">*</span></label>
            <input class="tf-input" id="tpl-name" placeholder="如：党旗礼赞">
          </div>
          <div class="tf-field">
            <label class="tf-label">方向 <span class="req">*</span></label>
            <select class="tf-input" id="tpl-direction">
              <option value="竖屏">竖屏</option>
              <option value="横屏">横屏</option>
            </select>
          </div>
          <div class="tf-field">
            <label class="tf-label">状态 <span class="req">*</span></label>
            <select class="tf-input" id="tpl-state">
              <option value="on">启用</option>
              <option value="off">停用</option>
            </select>
          </div>
        </div>
        <div class="tf-row">
          <div class="tf-field">
            <label class="tf-label">适用建议 <span class="req">*</span></label>
            <input class="tf-input" id="tpl-guide" placeholder="如：建议多人合照，原图居中，红金边框">
            <div class="tf-tip">展示在移动端模板卡片上，如「建议多人合照，原图居中，红金边框」</div>
          </div>
        </div>
        <div class="tf-row">
          <div class="tf-field">
            <label class="tf-label">归属活动</label>
            <div class="tf-act-pick" id="tpl-act-pick"></div>
            <div class="tf-tip">不勾选 = 公共模板，所有活动都能选；勾选 = 仅这些活动可用。保存后自动同步到「活动管理 → 创作能力 → 启用模板」</div>
          </div>
        </div>

      </div>
      <div class="tpl-modal-footer">
        <button class="dv-btn" onclick="closeTplModal()">取消</button>
        <button class="dv-btn primary" onclick="saveTplModal()">保存</button>
      </div>
    </div>
  </div>

  <div id="tpl-toast-area"></div>
</div>

<script>
/* ================= 模板管理（与移动端 TEMPLATES 一致） ================= */
/* 模板单条数据只有一份：window.__TPL_LIST（shell），活动配置页读同一份 */
function TPL_ALL() { return (window.__TPL_LIST = window.__TPL_LIST || []); }
function tplBgOf(id) {
  var n = 0; for (var i = 0; i < id.length; i++) n += id.charCodeAt(i);
  return (n % 8) + 1;
}
function tplActCell(t) {
  var ids = t.actIds || [];
  if (!ids.length) return '<span style="color:#999">公共</span>';
  var names = ids.map(function(id) { return pcActivityOf(id) ? pcActivityOf(id).name : ''; }).filter(Boolean);
  if (!names.length) return '<span style="color:#999">公共</span>';
  var first = names[0];
  var rest = names.length - 1;
  return '<span title="' + names.join('、') + '">' + first + (rest > 0 ? ' <span style="color:#0B5DEA">+' + rest + '</span>' : '') + '</span>';
}
function tplShowToast(msg) {
  var ta = document.getElementById('tpl-toast-area');
  ta.innerHTML = '<div class="toast" style="position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:2000;background:rgba(0,0,0,0.82);color:#fff;padding:12px 24px;border-radius:8px;font-size:14px">' + msg + '</div>';
  setTimeout(function(){ ta.innerHTML = ''; }, 1600);
}
/* ---- 筛选下拉：客户 → 活动级联 ---- */
function tplFillFilters() {
  var cEl = document.getElementById('f-tpl-cust');
  var cOpts = '<option value="">全部客户</option>';
  (window.__CUSTOMER_LIST || []).forEach(function(c) {
    if (c.enabled === false) return;
    cOpts += '<option value="' + c.id + '">' + c.name + '</option>';
  });
  cEl.innerHTML = cOpts;
  tplSyncActivityFilter();
}
function tplSyncActivityFilter() {
  var custId = document.getElementById('f-tpl-cust').value;
  var aEl = document.getElementById('f-tpl-act');
  var aOpts = '<option value="">全部</option>';
  (window.__ACTIVITY_LIST || []).forEach(function(a) {
    if (custId && a.customerId !== custId) return;
    aOpts += '<option value="' + a.id + '">' + a.name + '</option>';
  });
  aEl.innerHTML = aOpts;
  renderTplMgmt();
}
var TPL_SELECTED = {};
function toggleAllTpl(el) {
  TPL_ALL().forEach(function(t) { if (el.checked) TPL_SELECTED[t.id] = true; else delete TPL_SELECTED[t.id]; });
  renderTplMgmt();
}
function onTplCheck(el) {
  var id = el.getAttribute('data-tid');
  if (el.checked) TPL_SELECTED[id] = true; else delete TPL_SELECTED[id];
}
function renderTplMgmt() {
  var st = document.getElementById('f-tpl-state').value;
  var dir = document.getElementById('f-tpl-dir').value;
  var kw = (document.getElementById('f-tpl-name').value || '').trim();
  var custF = document.getElementById('f-tpl-cust').value;
  var actF = document.getElementById('f-tpl-act').value;
  var list = TPL_ALL().filter(function(t) {
    if (st === 'on' && t.state !== 'on') return false;
    if (st === 'off' && t.state !== 'off') return false;
    if (dir && (t.direction || '') !== dir) return false;
    if (kw && t.name.indexOf(kw) < 0) return false;
    if (custF) {
      var hit = (t.actIds || []).some(function(id) {
        var a = pcActivityOf(id);
        return a && a.customerId === custF;
      });
      if (!hit) return false;
    }
    if (actF && (t.actIds || []).indexOf(actF) < 0) return false;
    return true;
  });
  var tbody = document.getElementById('tpl-tbody');
  var html = '';
  list.forEach(function(t) {
    var ck = TPL_SELECTED[t.id] ? ' checked' : '';
    html += '<tr>' +
      '<td><input type="checkbox" data-tid="' + t.id + '"' + ck + ' onclick="onTplCheck(this)"></td>' +
      '<td><span class="tpl-thumb">' + (t.img
        ? '<img src="' + t.img + '" style="width:100%;height:100%;object-fit:cover;display:block">'
        : '<span class="pt-bg2 wb-' + tplBgOf(t.id) + '"></span><span class="pt-person2"></span>') + '</span></td>' +
      '<td>' + t.name + '</td>' +
      '<td>' + tplActCell(t) + '</td>' +
      '<td>' + (t.direction || '—') + '</td>' +
      '<td class="tpl-leaf">' + (t.guide || '—') + '</td>' +
      '<td>' + (t.state === 'on'
        ? '<span class="tpl-state-tag s-on">启用</span>'
        : '<span class="tpl-state-tag s-off">停用</span>') + '</td>' +
      '<td class="tpl-leaf">' + t.uses + '</td>' +
      '<td class="tpl-leaf">' + t.time + '</td>' +
      '<td>' +
        '<a class="action-link" onclick="openTplModal(\'' + t.id + '\')">编辑</a>' +
        (t.state === 'on'
          ? '<a class="action-link" style="color:#fa8c16" onclick="tplToggle(\'' + t.id + '\')">停用</a>'
          : '<a class="action-link" onclick="tplToggle(\'' + t.id + '\')">启用</a>') +
        '<a class="action-link warn" onclick="delTpl(\'' + t.id + '\')">删除</a>' +
      '</td>' +
      '</tr>';
  });
  if (!list.length) {
    html = '<tr><td colspan="10" style="text-align:center;color:#999;padding:40px 0">暂无符合条件的模板</td></tr>';
  }
  tbody.innerHTML = html;
  var allEl = document.getElementById('tpl-all');
  if (allEl) allEl.checked = list.length > 0 && list.every(function(t) { return TPL_SELECTED[t.id]; });
  renderPager('tpl-pager', list.length, 1, 10);
}
function batchDelTpl() {
  var ids = Object.keys(TPL_SELECTED);
  if (!ids.length) { tplShowToast('请先勾选模板'); return; }
  if (!confirm('确定删除所选 ' + ids.length + ' 个模板吗？删除后不可恢复。')) return;
  window.__TPL_LIST = TPL_ALL().filter(function(t) { return !TPL_SELECTED[t.id]; });
  TPL_SELECTED = {};
  renderTplMgmt();
  tplShowToast('已删除 ' + ids.length + ' 个模板');
}
function delTpl(id) {
  var t = TPL_ALL().filter(function(x){ return x.id === id; })[0];
  if (!t) return;
  if (!confirm('确定删除模板「' + t.name + '」吗？删除后不可恢复。')) return;
  window.__TPL_LIST = TPL_ALL().filter(function(x){ return x.id !== id; });
  showToast('已删除模板：' + t.name, 'success');
  renderTplMgmt();
}
function tplToggle(id) {
  var t = TPL_ALL().filter(function(x){ return x.id === id; })[0];
  if (!t) return;
  t.state = (t.state === 'on') ? 'off' : 'on';
  tplShowToast(t.state === 'on' ? '已启用：' + t.name : '已停用：' + t.name);
  renderTplMgmt();
}
function resetTplFilter() {
  document.getElementById('f-tpl-state').value = '';
  document.getElementById('f-tpl-dir').value = '';
  document.getElementById('f-tpl-name').value = '';
  document.getElementById('f-tpl-cust').value = '';
  document.getElementById('f-tpl-act').value = '';
  TPL_SELECTED = {};
  renderTplMgmt();
}
function init_template_mgmt() { tplFillFilters(); renderTplMgmt(); }
init_template_mgmt();

/* ================= 模板新增/编辑弹窗 ================= */
var TPL_MODAL_EDIT_ID = null;
function openTplModal(id) {
  TPL_MODAL_EDIT_ID = id || null;
  var t = null;
  if (id) t = TPL_ALL().filter(function(x){ return x.id === id; })[0];
  document.getElementById('tpl-modal-title').textContent = id ? '编辑模板' : '新增模板';
  document.getElementById('tpl-name').value = t ? t.name : '';
  document.getElementById('tpl-state').value = t ? t.state : 'on';
  document.getElementById('tpl-direction').value = t ? (t.direction || '竖屏') : '竖屏';
  document.getElementById('tpl-guide').value = t ? t.guide : '';
  var actBox = document.getElementById('tpl-act-pick');
  var ahtml = '';
  (window.__ACTIVITY_LIST || []).forEach(function(a) {
    var on = t && (t.actIds || []).indexOf(a.id) >= 0;
    ahtml += '<label><input type="checkbox" class="tpl-act-cb" value="' + a.id + '"' + (on ? ' checked' : '') + '>' + a.name + '</label>';
  });
  if (!ahtml) ahtml = '<span style="color:#999;font-size:13px">暂无可选活动</span>';
  actBox.innerHTML = ahtml;
  tplRenderImg(t ? t.img : null);
  document.getElementById('tpl-modal').style.display = 'flex';
}
function tplRenderImg(dataUrl) {
  var pv = document.getElementById('tpl-img-preview');
  if (dataUrl) {
    pv.innerHTML = '<img src="' + dataUrl + '" alt="模板图片">';
    pv.classList.add('has-img');
  } else {
    pv.innerHTML = '<div class="tpl-img-ph"></div>';
    pv.classList.remove('has-img');
  }
}
function tplImgChosen(inp) {
  var f = inp.files && inp.files[0];
  if (!f) return;
  var rd = new FileReader();
  rd.onload = function(e) { tplRenderImg(e.target.result); };
  rd.readAsDataURL(f);
  inp.value = '';
}
function tplRemoveImg() { tplRenderImg(null); }
function closeTplModal() { document.getElementById('tpl-modal').style.display = 'none'; }
function saveTplModal() {
  var name = document.getElementById('tpl-name').value.trim();
  var guide = document.getElementById('tpl-guide').value.trim();
  if (!name) { showToast('请填写模板名称', 'warn'); return; }
  if (!guide) { showToast('请填写适用建议', 'warn'); return; }
  var imgEl = document.getElementById('tpl-img-preview');
  var hasImg = imgEl.classList.contains('has-img');
  var img = hasImg ? (imgEl.querySelector('img') ? imgEl.querySelector('img').src : null) : null;
  var actIds = [];
  document.querySelectorAll('#tpl-act-pick .tpl-act-cb').forEach(function(cb) {
    if (cb.checked) actIds.push(cb.getAttribute('value'));
  });
  var data = {
    name: name,
    img: img,
    state: document.getElementById('tpl-state').value,
    direction: document.getElementById('tpl-direction').value,
    guide: guide,
    actIds: actIds
  };
  if (TPL_MODAL_EDIT_ID) {
    var t = TPL_ALL().filter(function(x){ return x.id === TPL_MODAL_EDIT_ID; })[0];
    if (t) {
      for (var k in data) t[k] = data[k];
      showToast('模板已保存：' + name, 'success');
    }
  } else {
    TPL_ALL().push({
      id: 'tpl' + (TPL_ALL().length + 1), uses: 0, time: actNowStr(),
      img: data.img,
      state: data.state,
      direction: data.direction,
      name: data.name, guide: data.guide,
      actIds: data.actIds
    });
    showToast('模板已新增：' + name, 'success');
  }
  /* 归属活动变了 → 同步活动侧的启用清单 */
  if (typeof pcSyncActivityFromAssets === 'function') pcSyncActivityFromAssets();
  closeTplModal();
  renderTplMgmt();
}
function actNowStr() {
  var d = new Date();
  function p(n) { return ('0' + n).slice(-2); }
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}
</script>
