<!-- PAGE_META: {"id": "template-mgmt", "title": "模板管理"} -->
<div class="page" id="page-template-mgmt">
  <style>
    /* 模板管理页局部样式 */
    .tpl-tbl th { text-align: left; }
    .tpl-tbl .tpl-thumb-cell { width: 60px; }
    .tpl-thumb {
      width: 44px; height: 58px; border-radius: 4px; overflow: hidden;
      position: relative; display: inline-block; background: #F0EAE0; vertical-align: middle;
    }
    .tpl-thumb .pt-bg2 { position: absolute; inset: 0; }
    .tpl-thumb .pt-person2 {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
      width: 55%; aspect-ratio: 3/4; border-radius: 3px; z-index: 2;
      background: linear-gradient(135deg, #F5D0A9, #D9A066);
      border: 1.5px solid rgba(255,255,255,0.8);
    }
    .tpl-leaf { font-size: 13px; color: #666; }
        .tpl-state-tag {
      display: inline-block; padding: 2px 10px; border-radius: 3px; font-size: 12px;
    }
    .tpl-state-tag.s-on { color: #52c41a; background: #f6ffed; }
    .tpl-state-tag.s-off { color: #999; background: #f5f5f5; }
    .action-link { color: #1677ff; cursor: pointer; margin-right: 12px; font-size: 13px; }
    .action-link.warn { color: #C0392B; }
    /* 模板新增/编辑弹窗 */
    .tpl-modal { position: fixed; inset: 0; z-index: 1300; display: none; align-items: center; justify-content: center; }
    .tpl-modal-mask { position: absolute; inset: 0; background: rgba(0,0,0,0.45); }
    .tpl-modal-box { position: relative; background: #fff; border-radius: 8px; width: 640px; max-height: 86vh; overflow-y: auto; padding: 20px 24px; box-shadow: 0 8px 32px rgba(0,0,0,0.15); }
    .tpl-modal-title { font-size: 15px; font-weight: 600; color: #333; margin-bottom: 16px; }
    .tf-row { display: flex; gap: 16px; margin-bottom: 14px; }
    .tf-field { flex: 1; min-width: 0; }
    .tf-label { font-size: 13px; color: #333; margin-bottom: 6px; display: block; }
    .tf-label .req { color: #ff4d4f; margin-left: 2px; }
    .tf-input { width: 100%; height: 36px; padding: 0 12px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 14px; outline: none; box-sizing: border-box; }
    .tf-input:focus { border-color: #1677ff; box-shadow: 0 0 0 2px rgba(22,119,255,0.1); }
    .tf-tip { font-size: 12px; color: #999; margin-top: 4px; }
    .tpl-modal-footer { display: flex; justify-content: flex-end; gap: 12px; margin-top: 20px; padding-top: 16px; border-top: 1px solid #f0f0f0; }
    /* 模板图片上传 */
    .tpl-img-row { display: flex; align-items: flex-start; gap: 20px; margin-bottom: 16px; }
    .tpl-img-preview { width: 120px; height: 160px; border: 1px dashed #d9d9d9; border-radius: 4px; overflow: hidden; flex-shrink: 0; background: #fafafa; display: flex; align-items: center; justify-content: center; }
    .tpl-img-preview.has-img { border-style: solid; border-color: #e0e0e0; }
    .tpl-img-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .tpl-img-ph { width: 100%; height: 100%; background: linear-gradient(135deg,#F0EAE0 0%,#E8DFD0 100%); position: relative; }
    .tpl-img-ph::after { content: '模板图片'; position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); font-size: 12px; color: #b8a88f; }
    .tpl-img-ops { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
    .tpl-img-tip { font-size: 12px; color: #999; line-height: 1.6; margin-top: 4px; }
  </style>

  <div class="page-header">
    <div class="page-title">模板管理 <span class="sub">手机端拍照可选模板，与移动端模板库一致</span></div>
    <div>
      <button class="filter-btn primary" onclick="openTplModal()">新增模板</button>
    </div>
  </div>

  <div class="filter-bar">
    <div class="filter-item">
      <span class="filter-label">状态</span>
      <select class="filter-select" id="f-tpl-state" onchange="renderTplMgmt()">
        <option value="">全部</option>
        <option value="on">启用</option>
        <option value="off">禁用</option>
      </select>
    </div>
    <div class="filter-item">
      <span class="filter-label">模板名称</span>
      <input class="filter-input" id="f-tpl-name" placeholder="输入模板名称" oninput="renderTplMgmt()">
    </div>
    <div class="filter-item">
      <button class="filter-btn primary" onclick="renderTplMgmt()">查询</button>
      <button class="filter-btn" onclick="resetTplFilter()">重置</button>
    </div>
  </div>

  <div class="table-card">
    <table class="tpl-tbl">
      <thead>
        <tr>
          <th class="tpl-thumb-cell">模板图片</th>
          <th>模板名称</th>
          <th>适用建议</th>
          <th>状态</th>
          <th>使用次数</th>
          <th>更新时间</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="tpl-tbody"></tbody>
    </table>
  </div>

  <!-- 模板新增/编辑弹窗 -->
  <div class="tpl-modal" id="tpl-modal" style="display:none">
    <div class="tpl-modal-mask" onclick="closeTplModal()"></div>
    <div class="tpl-modal-box">
      <div class="tpl-modal-title" id="tpl-modal-title">新增模板</div>
      <div class="tpl-modal-body">
        <div class="tpl-img-row">
          <div class="tpl-img-preview" id="tpl-img-preview">
            <div class="tpl-img-ph"></div>
          </div>
          <div class="tpl-img-ops">
            <button class="dv-btn" onclick="document.getElementById('tpl-img-file').click()">上传图片</button>
            <button class="dv-btn" onclick="tplRemoveImg()">移除</button>
            <div class="tpl-img-tip">建议控制在 2MB 内，移动端模板卡片使用该图片</div>
            <input type="file" id="tpl-img-file" accept="image/*" style="display:none" onchange="tplImgChosen(this)">
          </div>
        </div>
        <div class="tf-row">
          <div class="tf-field">
            <label class="tf-label">模板名称 <span class="req">*</span></label>
            <input class="tf-input" id="tpl-name" placeholder="如：党旗礼赞">
          </div>
          <div class="tf-field">
            <label class="tf-label">状态</label>
            <select class="tf-input" id="tpl-state">
              <option value="on">启用</option>
              <option value="off">禁用</option>
            </select>
          </div>
        </div>
        <div class="tf-row">
          <div class="tf-field">
            <label class="tf-label">适用建议 <span class="req">*</span></label>
            <input class="tf-input" id="tpl-guide" placeholder="如：建议单人、正面、半身，光线充足">
            <div class="tf-tip">展示在移动端模板卡片上，如「建议多人合照，原图居中，红金边框」</div>
          </div>
        </div>

      </div>
      <div class="tpl-modal-footer">
        <button class="dv-btn" onclick="closeTplModal()">取消</button>
        <button class="dv-btn primary" onclick="saveTplModal()">保存</button>
      </div>
    </div>
  </div>

  <div id="tpl-toast-area"></div>
</div>

<script>
/* ================= 模板管理（与移动端 TEMPLATES 一致） ================= */
var TPL_LIST = [
  { id: 'shenghui', name: '盛会留念框', group: 'classic',    groupName: '庄重经典', people: '1-6 人', guide: '建议多人合照，原图居中，红金边框', estTime: '约 3 秒',  state: 'on',  uses: 158, time: '09-28 14:30' },
  { id: 'fenjin',   name: '奋进新征程', group: 'classic',    groupName: '庄重经典', people: '1-4 人', guide: '竖版照片 + 金色题字 + 福建剪影',      estTime: '约 3 秒',  state: 'on',  uses: 121, time: '09-28 14:31' },
  { id: 'dangqi',   name: '党旗礼赞',   group: 'smart',      groupName: '智能海报', people: '1-2 人', guide: '建议单人、正面、半身，红色主题场景', estTime: '约 10 秒', state: 'on',  uses: 203, time: '09-28 14:28' },
  { id: 'shengshi', name: '盛世华章',   group: 'smart',      groupName: '智能海报', people: '1-2 人', guide: '人物居中，金色光影与山河纹理',      estTime: '约 10 秒', state: 'on',  uses: 176, time: '09-28 14:28' },
  { id: 'gutian',   name: '古田星火',   group: 'smart',      groupName: '智能海报', people: '1-2 人', guide: '人物前景 + 红色文化场景',            estTime: '约 10 秒', state: 'on',  uses: 98,  time: '09-28 14:29' },
  { id: 'fujian',   name: '福见山海',   group: 'smart',      groupName: '智能海报', people: '1-2 人', guide: '人物前景 + 福建山海与城市意象',      estTime: '约 10 秒', state: 'on',  uses: 64,  time: '09-28 14:29' },
  { id: 'gongbi',   name: '工笔华章',   group: 'aiguofeng',  groupName: 'AI 国风', people: '1 人',   guide: '建议单人、正面、半身，光线充足',    estTime: '约 30 秒', state: 'on',  uses: 187, time: '09-28 14:32' },
  { id: 'shuimo',   name: '水墨山河',   group: 'aiguofeng',  groupName: 'AI 国风', people: '1 人',   guide: '建议单人、正面、半身，淡彩水墨',    estTime: '约 30 秒', state: 'on',  uses: 88,  time: '09-28 14:32' },
  { id: 'qban',     name: 'Q版先锋',    group: 'aichuangyi', groupName: 'AI 创意', people: '1 人',   guide: '得体正装半身照，创意风格',          estTime: '约 30 秒', state: 'off', uses: 32,  time: '09-28 14:33' }
];
function tplBgOf(id) {
  var n = 0; for (var i = 0; i < id.length; i++) n += id.charCodeAt(i);
  return (n % 8) + 1;
}
function tplShowToast(msg) {
  var ta = document.getElementById('tpl-toast-area');
  ta.innerHTML = '<div class="toast" style="position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:2000;background:rgba(0,0,0,0.82);color:#fff;padding:12px 24px;border-radius:8px;font-size:14px">' + msg + '</div>';
  setTimeout(function(){ ta.innerHTML = ''; }, 1600);
}
function renderTplMgmt() {
  var st = document.getElementById('f-tpl-state').value;
  var kw = (document.getElementById('f-tpl-name').value || '').trim();
  var list = TPL_LIST.filter(function(t) {
    if (st === 'on' && t.state !== 'on') return false;
    if (st === 'off' && t.state !== 'off') return false;
    if (kw && t.name.indexOf(kw) < 0) return false;
    return true;
  });
  var tbody = document.getElementById('tpl-tbody');
  var html = '';
  list.forEach(function(t) {
    html += '<tr>' +
      '<td><span class="tpl-thumb">' + (t.img
        ? '<img src="' + t.img + '" style="width:100%;height:100%;object-fit:cover;display:block">'
        : '<span class="pt-bg2 wb-' + tplBgOf(t.id) + '"></span><span class="pt-person2"></span>') + '</span></td>' +
      '<td>' + t.name + (t.uses >= 150 ? ' <span class="tag-hot" style="color:#C0392B;background:#FDE6E4;font-size:12px;padding:1px 6px;border-radius:3px">热门</span>' : '') + '</td>' +
      '<td class="tpl-leaf">' + (t.guide || '—') + '</td>' +
      '<td>' + (t.state === 'on'
        ? '<span class="tpl-state-tag s-on">启用</span>'
        : '<span class="tpl-state-tag s-off">禁用</span>') + '</td>' +
      '<td class="tpl-leaf">' + t.uses + '</td>' +
      '<td class="tpl-leaf">' + t.time + '</td>' +
      '<td>' +
        '<a class="action-link" onclick="openTplModal(\'' + t.id + '\')">编辑</a>' +
        (t.state === 'on'
          ? '<a class="action-link warn" onclick="tplToggle(\'' + t.id + '\')">禁用</a>'
          : '<a class="action-link" onclick="tplToggle(\'' + t.id + '\')">启用</a>') + '</td>' +
      '</tr>';
  });
  if (!list.length) {
    html = '<tr><td colspan="7" style="text-align:center;color:#999;padding:40px 0">暂无符合条件的模板</td></tr>';
  }
  tbody.innerHTML = html;
}
function tplToggle(id) {
  var t = TPL_LIST.filter(function(x){ return x.id === id; })[0];
  if (!t) return;
  t.state = (t.state === 'on') ? 'off' : 'on';
  tplShowToast(t.state === 'on' ? '已启用：' + t.name : '已禁用：' + t.name);
  renderTplMgmt();
}
function resetTplFilter() {
  document.getElementById('f-tpl-state').value = '';
  document.getElementById('f-tpl-name').value = '';
  renderTplMgmt();
}
function init_template_mgmt() { renderTplMgmt(); }
init_template_mgmt();

/* ================= 模板新增/编辑弹窗 ================= */
var TPL_MODAL_EDIT_ID = null;
function openTplModal(id) {
  TPL_MODAL_EDIT_ID = id || null;
  var t = null;
  if (id) t = TPL_LIST.filter(function(x){ return x.id === id; })[0];
  document.getElementById('tpl-modal-title').textContent = id ? '编辑模板' : '新增模板';
  document.getElementById('tpl-name').value = t ? t.name : '';
  document.getElementById('tpl-state').value = t ? t.state : 'on';
  document.getElementById('tpl-guide').value = t ? t.guide : '';
  tplRenderImg(t ? t.img : null);
  document.getElementById('tpl-modal').style.display = 'flex';
}
function tplRenderImg(dataUrl) {
  var pv = document.getElementById('tpl-img-preview');
  if (dataUrl) {
    pv.innerHTML = '<img src="' + dataUrl + '" alt="模板图片">';
    pv.classList.add('has-img');
  } else {
    pv.innerHTML = '<div class="tpl-img-ph"></div>';
    pv.classList.remove('has-img');
  }
}
function tplImgChosen(inp) {
  var f = inp.files && inp.files[0];
  if (!f) return;
  var rd = new FileReader();
  rd.onload = function(e) { tplRenderImg(e.target.result); };
  rd.readAsDataURL(f);
  inp.value = '';
}
function tplRemoveImg() { tplRenderImg(null); }
function closeTplModal() { document.getElementById('tpl-modal').style.display = 'none'; }
function saveTplModal() {
  var name = document.getElementById('tpl-name').value.trim();
  var guide = document.getElementById('tpl-guide').value.trim();
  if (!name) { showToast('请填写模板名称', 'warn'); return; }
  if (!guide) { showToast('请填写适用建议', 'warn'); return; }
  var imgEl = document.getElementById('tpl-img-preview');
  var hasImg = imgEl.classList.contains('has-img');
  var img = hasImg ? (imgEl.querySelector('img') ? imgEl.querySelector('img').src : null) : null;
  var data = {
    name: name,
    img: img,
    state: document.getElementById('tpl-state').value,
    guide: guide,
  };
  if (TPL_MODAL_EDIT_ID) {
    var t = TPL_LIST.filter(function(x){ return x.id === TPL_MODAL_EDIT_ID; })[0];
    if (t) {
      for (var k in data) t[k] = data[k];
      showToast('模板已保存：' + name, 'success');
    }
  } else {
    TPL_LIST.push({
      id: 'tpl' + (TPL_LIST.length + 1), uses: 0, time: '09-02 现在',
      img: data.img,
      state: data.state,
      name: data.name, guide: data.guide
    });
    showToast('模板已新增：' + name, 'success');
  }
  closeTplModal();
  renderTplMgmt();
}
</script>
