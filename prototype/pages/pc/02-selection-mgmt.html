<!-- PAGE_META: {"id": "selection-mgmt", "title": "上屏审核"} -->
<div class="page" id="page-selection-mgmt">
  <style>
    /* 申请上屏页局部样式 */
    .sel-tbl th, .sel-tbl td { text-align: left; }
    .sel-tbl .thumb-cell { width: 56px; }
    .sel-thumb {
      width: 44px; height: 58px; border-radius: 4px; overflow: hidden;
      position: relative; cursor: zoom-in; display: inline-block;
      background: #F0EAE0; vertical-align: middle;
    }
    .sel-thumb .pt-bg { position: absolute; inset: 0; }
    .sel-thumb .pt-person {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
      width: 55%; aspect-ratio: 3/4; border-radius: 3px; z-index: 2;
      background: linear-gradient(135deg, #F5D0A9, #D9A066);
      border: 1.5px solid rgba(255,255,255,0.8);
    }
    /* V2.1 画风衍生缩略滤镜 */
    .sel-thumb.effect-guangying .pt-bg, .sel-thumb.effect-guangying .pt-person { filter: brightness(1.08) contrast(1.06); }
    .sel-thumb.effect-shuimo    .pt-bg, .sel-thumb.effect-shuimo    .pt-person { filter: grayscale(0.55) sepia(0.35) contrast(0.98); }
    .sel-thumb.effect-shouhui  .pt-bg, .sel-thumb.effect-shouhui  .pt-person { filter: saturate(0.45) contrast(1.12); }
    .sel-thumb.effect-hongchou  .pt-bg, .sel-thumb.effect-hongchou  .pt-person { filter: sepia(0.22) saturate(1.12) contrast(1.04); }
    .td-check { width: 36px; }
    /* 选中行高亮蓝色底 */
    .sel-tbl tbody tr.row-selected { background: #e6f4ff; }
    /* 批量按钮 disabled 态：浅色不可点；勾选后高亮 */
    .filter-btn.disabled {
      background: #f5f5f5; color: #bfbfbf; border-color: #d9d9d9;
      cursor: not-allowed; box-shadow: none;
    }
    /* 大图预览 */
    .preview-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000;
      display: none; align-items: center; justify-content: center;
    }
    .preview-overlay.show { display: flex; }
    .preview-box {
      background: #fff; border-radius: 8px; padding: 16px;
      width: 420px; text-align: center; position: relative;
    }
    .preview-box .pv-img {
      width: 100%; aspect-ratio: 3/4; border-radius: 6px; overflow: hidden;
      position: relative; background: #26262A;
    }
    .preview-box .pv-img .photo-bg { position: absolute; inset: 0; }
    .preview-box .pv-img .photo-person {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
      width: 60%; aspect-ratio: 3/4; border-radius: 8px; z-index: 2;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .preview-box .pv-meta { font-size: 13px; color: #666; margin-top: 12px; text-align: left; line-height: 1.8; }
    .preview-box .pv-close { position: absolute; top: 10px; right: 14px; font-size: 20px; cursor: pointer; color: #999; }
    .preview-box .pv-close:hover { color: #333; }
    /* 上屏设备选择弹窗（多选表格，对齐真实系统） */
    .device-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 1200; display: none; align-items: center; justify-content: center; }
    .device-modal.show { display: flex; }
    .device-box { background: #fff; border-radius: 8px; width: 640px; padding: 20px 24px; }
    .device-box .dv-title { font-size: 15px; font-weight: 600; color: #333; margin-bottom: 14px; }
    .dv-search { margin-bottom: 12px; }
    .dv-search .filter-input { width: 100%; box-sizing: border-box; }
    .dv-tbl { width: 100%; border-collapse: collapse; }
    .dv-tbl th { background: #fafafa; padding: 8px 12px; font-size: 13px; font-weight: 600; color: #333; text-align: left; border-bottom: 1px solid #f0f0f0; white-space: nowrap; }
    .dv-tbl td { padding: 10px 12px; font-size: 13px; color: #333; border-bottom: 1px solid #f0f0f0; }
    .dv-tbl tr:hover { background: #f9fbff; }
    .dv-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
    .dv-btn { padding: 7px 18px; border-radius: 4px; font-size: 13px; cursor: pointer; border: 1px solid #d9d9d9; background: #fff; color: #333; }
    .dv-btn.primary { background: #1677ff; border-color: #1677ff; color: #fff; }
    .dv-btn.disabled { background: #f5f5f5; color: #bfbfbf; border-color: #d9d9d9; cursor: not-allowed; }
  </style>

  <div class="page-header">
    <div class="page-title">上屏展示审核 <span class="sub">用户已授权同意展示的照片，确认后投放至现场大屏</span></div>
  </div>

  <div class="filter-bar">
    <div class="filter-item">
      <span class="filter-label">状态</span>
      <select class="filter-select" id="f-sel-onscreen" onchange="selApplyFilter()">
        <option value="">全部</option>
        <option value="onscreen">正在展示</option>
        <option value="off">等待上屏</option>
      </select>
    </div>
    <div class="filter-item">
      <span class="filter-label">模板</span>
      <select class="filter-select" id="f-sel-tpl" onchange="selApplyFilter()">
        <option value="">全部</option>
        <option value="党旗礼赞">党旗礼赞</option>
        <option value="工笔华章">工笔华章</option>
        <option value="盛会留念框">盛会留念框</option>
        <option value="盛世华章">盛世华章</option>
        <option value="水墨山河">水墨山河</option>
        <option value="古田星火">古田星火</option>
        <option value="福见山海">福见山海</option>
        <option value="Q版先锋">Q版先锋</option>
        <option value="奋进新征程">奋进新征程</option>
      </select>
    </div>
    <div class="filter-item">
      <span class="filter-label">照片方向</span>
      <select class="filter-select" id="f-sel-dir" onchange="selApplyFilter()">
        <option value="">全部</option>
        <option value="竖屏">竖屏</option>
        <option value="横屏">横屏</option>
      </select>
    </div>
    <div class="filter-item">
      <span class="filter-label">来源屏幕</span>
      <select class="filter-select" id="f-sel-src-screen" onchange="selApplyFilter()"></select>
    </div>
    <div class="filter-item">
      <span class="filter-label">上屏屏幕</span>
      <select class="filter-select" id="f-sel-on-screen" onchange="selApplyFilter()"></select>
    </div>
    <div class="filter-item">
      <input class="filter-input" id="f-sel-no" placeholder="请输入照片编号" oninput="selApplyFilter()">
    </div>
    <div class="filter-item">
      <button class="filter-btn" onclick="selResetFilter()">重置</button>
      <button class="filter-btn search" onclick="selApplyFilter()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>搜索</button>
    </div>
    <div class="filter-spacer" style="flex:1"></div>
    <div class="filter-item">
      <button class="filter-btn disabled" id="btn-batch-on" onclick="selBatchOnScreen()">批量上屏</button>
      <button class="filter-btn disabled" id="btn-batch-off" onclick="selBatchOffScreen()">批量下屏</button>
    </div>
  </div>

  <div class="table-card">
    <table class="sel-tbl" id="sel-table">
      <thead>
        <tr>
          <th class="td-check"></th>
          <th class="thumb-cell">纪念照</th>
          <th>编号</th>
          <th>模板</th>
          <th>画风</th>
          <th>账号</th>
          <th>上屏屏幕</th>
          <th>来源屏幕</th>
          <th>上屏状态</th>
          <th>上屏时间</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="sel-tbody"></tbody>
    </table>
    <div class="pagination" id="sel-pager"></div>
  </div>

  <!-- 大图预览 -->
  <div class="preview-overlay" id="sel-preview-overlay" onclick="closeSelPreview()">
    <div class="preview-box" onclick="event.stopPropagation()">
      <span class="pv-close" onclick="closeSelPreview()">×</span>
      <div class="pv-img" id="sel-pv-img"></div>
      <div class="pv-meta" id="sel-pv-meta"></div>
    </div>
  </div>

  <!-- 上屏设备选择弹窗（多选，对齐真实系统） -->
  <div class="device-modal" id="device-modal" onclick="closeDeviceModal()">
    <div class="device-box" onclick="event.stopPropagation()">
      <div class="dv-title">选择上屏设备</div>
      <div class="dv-search"><input class="filter-input" id="dv-kw" placeholder="请输入设备名称" oninput="renderDevPicker()"></div>
      <table class="dv-tbl">
        <thead>
          <tr>
            <th class="td-check"><input type="checkbox" id="dv-all" onchange="toggleAllDev(this)"></th>
            <th>设备名称</th>
            <th>设备MAC</th>
            <th>更新时间</th>
          </tr>
        </thead>
        <tbody id="dv-tbody"></tbody>
      </table>
      <div class="dv-actions">
        <button class="dv-btn" onclick="closeDeviceModal()">取消</button>
        <button class="dv-btn primary disabled" id="dv-confirm" onclick="confirmDevice()">确认（0）</button>
      </div>
    </div>
  </div>

  <div id="sel-toast-area"></div>
</div>

<script>
/* ================= 申请上屏（用户已授权同意上屏） ================= */
function _sSelName(id) { var s = (window.__STYLE_LIST || []).filter(function(x){ return x.id === id; })[0]; return s ? s.name : id; }
var SEL_LIST = [
  { no: 'FJDH-0328-01', wx: '138****0328', tpl: '党旗礼赞',   screen: '测试',        onScreen: '测试',              on: true,  onTime: '2026-09-30 10:21:05', offTime: null, time: '2026-09-30 10:21:05' },
  { no: 'FJDH-0002-01', wx: '139****8002', tpl: '盛会留念框', screen: 'P43-纪念相册', onScreen: '测试、P43-纪念相册', on: true,  onTime: '2026-09-30 09:12:18', offTime: null, time: '2026-09-30 09:12:18' },
  { no: 'FJDH-0002-02', wx: '139****8002', tpl: '盛会留念框', screen: 'P43-纪念相册', onScreen: '—',                on: false, onTime: null, offTime: null, time: '2026-09-30 09:26:51', sourceWorkId: 'FJDH-0002-01', styleId: 'shuimo' },
  { no: 'FJDH-0009-01', wx: '135****9009', tpl: '工笔华章',   screen: 'P43-纪念相册', onScreen: 'P43-纪念相册',       on: true,  onTime: '2026-09-30 09:20:33', offTime: null, time: '2026-09-30 09:20:33' },
  { no: 'FJDH-0015-01', wx: '137****0015', tpl: '盛世华章',   screen: 'P43-纪念相册', onScreen: '—',                on: false, onTime: null, offTime: null, time: '2026-09-30 09:31:26' },
  { no: 'FJDH-0021-01', wx: '136****0021', tpl: '水墨山河',   screen: 'P43-纪念相册', onScreen: '—',                on: false, onTime: null, offTime: null, time: '2026-09-30 09:44:12' },
  { no: 'FJDH-0033-01', wx: '139****0033', tpl: '盛会留念框', screen: '测试',        onScreen: '测试',              on: true,  onTime: '2026-09-30 10:02:55', offTime: null, time: '2026-09-30 10:02:55' },
  { no: 'FJDH-0052-01', wx: '135****0052', tpl: '福见山海',   screen: 'P43-纪念相册', onScreen: 'P43-纪念相册',       on: true,  onTime: '2026-09-30 10:15:09', offTime: null, time: '2026-09-30 10:15:09' },
  { no: 'FJDH-0068-01', wx: '136****0068', tpl: '奋进新征程', screen: 'P43-纪念相册', onScreen: '—',                on: false, onTime: null, offTime: null, time: '2026-09-30 10:26:38' },
  { no: 'FJDH-0077-01', wx: '139****0077', tpl: '工笔华章',   screen: 'P43-纪念相册', onScreen: '—',                on: false, onTime: null, offTime: null, time: '2026-09-30 10:30:14' },
  { no: 'FJDH-0084-01', wx: '135****0084', tpl: '盛世华章',   screen: '测试',        onScreen: '—',                on: false, onTime: null, offTime: null, time: '2026-09-30 10:35:47' }
];
var SEL_SELECTED = {};
var SEL_PAGE = 1;
var SEL_PAGE_SIZE = 10;
var SEL_TPL_DIR = { '盛会留念框': '横屏' };
var CURRENT_DEVICE_NO = null;   /* 上屏操作目标 */
var CURRENT_DEVICE_MODE = 'single'; /* single / batch */

function selTplBg(no) {
  var p = (SEL_LIST||[]).filter(function(x){ return x.no === no; })[0];
  if (p && p.sourceWorkId) return selTplBg(p.sourceWorkId);
  var n = parseInt(no.replace(/\D/g, ''), 10) || 1;
  return (n % 8) + 1;
}
function selCapNameOf(tpl) {
  var map = { '党旗礼赞': '智能海报', '工笔华章': 'AI 艺术', '盛会留念框': '经典框', '盛世华章': '智能海报', '水墨山河': 'AI 艺术', '古田星火': '智能海报', '福见山海': '智能海报', 'Q版先锋': 'AI 艺术', '奋进新征程': '经典框' };
  return map[tpl] || '智能海报';
}
function selShowToast(msg) {
  var ta = document.getElementById('sel-toast-area');
  ta.innerHTML = '<div class="toast" style="position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:2000;background:rgba(0,0,0,0.82);color:#fff;padding:12px 24px;border-radius:8px;font-size:14px">' + msg + '</div>';
  setTimeout(function(){ ta.innerHTML = ''; }, 1600);
}
function selDirOf(tpl) { return SEL_TPL_DIR[tpl] || '竖屏'; }
function selFillScreenFilters() {
  var opts = '<option value="">全部</option>';
  (window.__DEVICE_LIST || []).forEach(function(d) { opts += '<option value="' + d.name + '">' + d.name + '</option>'; });
  var a = document.getElementById('f-sel-src-screen'), b = document.getElementById('f-sel-on-screen');
  if (a) a.innerHTML = opts;
  if (b) b.innerHTML = opts;
}
function renderSelTable() {
  var osF  = document.getElementById('f-sel-onscreen').value;
  var tplF = document.getElementById('f-sel-tpl').value;
  var dirF = document.getElementById('f-sel-dir').value;
  var srcF = document.getElementById('f-sel-src-screen').value;
  var onF  = document.getElementById('f-sel-on-screen').value;
  var noF  = (document.getElementById('f-sel-no').value || '').trim();
  var list = SEL_LIST.filter(function(p) {
    if (osF === 'onscreen' && !p.on) return false;
    if (osF === 'off' && p.on) return false;
    if (tplF && p.tpl !== tplF) return false;
    if (dirF && selDirOf(p.tpl) !== dirF) return false;
    if (srcF && p.screen !== srcF) return false;
    if (onF && (p.onScreen || '') !== onF) return false;
    if (noF && p.no.indexOf(noF) < 0) return false;
    return true;
  });
  var tbody = document.getElementById('sel-tbody');
  var start = (SEL_PAGE - 1) * SEL_PAGE_SIZE;
  var pageList = list.slice(start, start + SEL_PAGE_SIZE);
  var html = '';
  pageList.forEach(function(p) {
    var bg = selTplBg(p.no);
    var checked = SEL_SELECTED[p.no] ? ' checked' : '';
    var rowCls = SEL_SELECTED[p.no] ? ' class="row-selected"' : '';
    var eff = p.styleId ? (' effect-' + p.styleId) : '';
    var styleTd = p.styleId
      ? '<td><span style="display:inline-block;padding:0 6px;font-size:11px;color:#8a641e;background:#fdf6e3;border:1px solid #eadfc4;border-radius:3px">' + _sSelName(p.styleId) + '</span></td>'
      : '<td><span style="display:inline-block;padding:0 6px;font-size:11px;color:#1677ff;background:#e6f4ff;border:1px solid #91caff;border-radius:3px">原图</span></td>';
    html += '<tr' + rowCls + '>' +
      '<td class="td-check"><input type="checkbox" class="sel-row-check" data-no="' + p.no + '"' + checked + ' onclick="onSelRowCheck(this)"></td>' +
      '<td><span class="sel-thumb' + eff + '" onclick="openSelPreview(\'' + p.no + '\')">' +
        '<span class="pt-bg wb-' + bg + '"></span><span class="pt-person"></span></span></td>' +
      '<td>' + p.no + '</td>' +
      '<td>' + p.tpl + '</td>' +
      styleTd +
      '<td>' + p.wx + '</td>' +
      '<td>' + (p.onScreen && p.onScreen !== '—' ? p.onScreen : '—') + '</td>' +
      '<td>' + p.screen + '</td>' +
      '<td>' + (p.on ? '<span class="badge-status active" style="background:#f6ffed;color:#52c41a">正在展示</span>'
                    : '<span class="badge-status" style="background:#e6f4ff;color:#1677ff">等待上屏</span>') + '</td>' +
      '<td>' + (p.onTime || '—') + '</td>' +
      '<td>' +
        '<a class="action-btn" onclick="selOpenDetail(\'' + p.no + '\')">详情</a>' +
        (p.on ? '<a class="action-btn" onclick="askOffScreen(\'' + p.no + '\')">下屏</a>'
              : '<a class="action-btn" onclick="askOnScreen(\'' + p.no + '\')">上屏</a>') + '</td>' +
      '</tr>';
  });
  if (!pageList.length) {
    html = '<tr><td colspan="10" style="text-align:center;color:#999;padding:40px 0">暂无符合条件的照片</td></tr>';
  }
  tbody.innerHTML = html;
  window.__PAGER['sel-pager'] = function(pg) { SEL_PAGE = pg; renderSelTable(); };
  renderPager('sel-pager', list.length, SEL_PAGE, SEL_PAGE_SIZE);
  updateBatchBtns();
}
/* 批量按钮：按勾选数据类型精确判断
   全部未上屏 → 批量上屏可点；全部已上屏 → 批量下屏可点；
   混合勾选（含已上屏+未上屏）→ 两个按钮都禁用 */
function updateBatchBtns() {
  var keys = Object.keys(SEL_SELECTED);
  var hasSel = keys.length > 0;
  var allOff = true, allOn = true;
  keys.forEach(function(no) {
    var p = SEL_LIST.filter(function(x){ return x.no === no; })[0];
    if (!p) return;
    if (p.on) allOff = false; else allOn = false;
  });
  var canOn = hasSel && allOff;    /* 勾选的都为未上屏 → 批量上屏可点 */
  var canOff = hasSel && allOn;    /* 勾选的都为已上屏 → 批量下屏可点 */
  document.getElementById('btn-batch-on').className = 'filter-btn' + (canOn ? ' primary' : ' disabled');
  document.getElementById('btn-batch-off').className = 'filter-btn' + (canOff ? '' : ' disabled');
}
function onSelRowCheck(el) {
  var no = el.getAttribute('data-no');
  if (el.checked) SEL_SELECTED[no] = true; else delete SEL_SELECTED[no];
  renderSelTable();
}
/* ---- 单个操作 ---- */
function askOnScreen(no) {
  CURRENT_DEVICE_NO = no;
  CURRENT_DEVICE_MODE = 'single';
  openDeviceModal();
}
function askOffScreen(no) {
  var p = SEL_LIST.filter(function(x){ return x.no === no; })[0];
  if (!p) return;
  p.on = false;
  p.onTime = null;
  p.onScreen = '—';
  selShowToast('已下屏：' + no);
  renderSelTable();
}
/* ---- 批量操作（也走设备选择） ---- */
function selBatchOnScreen() {
  var keys = Object.keys(SEL_SELECTED);
  if (!keys.length) { selShowToast('请先勾选照片'); return; }
  /* 只对未上屏的照片执行批量上屏（按钮已按类型禁用，这里兜底） */
  var unsel = SEL_LIST.filter(function(x){ return SEL_SELECTED[x.no] && !x.on; });
  if (!unsel.length) { selShowToast('勾选的照片均已上屏'); return; }
  CURRENT_DEVICE_NO = null;
  CURRENT_DEVICE_MODE = 'batch';
  openDeviceModal();
}
function selBatchOffScreen() {
  var keys = Object.keys(SEL_SELECTED);
  if (!keys.length) { selShowToast('请先勾选照片'); return; }
  /* 只对已上屏的照片执行批量下屏（按钮已按类型禁用，这里兜底） */
  var onlist = SEL_LIST.filter(function(x){ return SEL_SELECTED[x.no] && x.on; });
  if (!onlist.length) { selShowToast('勾选的照片均未上屏'); return; }
  onlist.forEach(function(p) { p.on = false; p.onTime = null; p.onScreen = '—'; });
  var n = onlist.length;
  SEL_SELECTED = {};
  selShowToast('已批量下屏 ' + n + ' 张');
  renderSelTable();
}
/* ---- 设备选择弹窗（多选，对齐真实系统） ---- */
var DV_SELECTED = {};
function renderDevPicker() {
  var kw = (document.getElementById('dv-kw').value || '').trim();
  var list = (window.__DEVICE_LIST || []).filter(function(d) { return !kw || d.name.indexOf(kw) >= 0; });
  var tb = document.getElementById('dv-tbody');
  var html = '';
  list.forEach(function(d) {
    var ck = DV_SELECTED[d.id] ? ' checked' : '';
    html += '<tr>' +
      '<td class="td-check"><input type="checkbox" data-did="' + d.id + '"' + ck + ' onclick="onDevCheck(this)"></td>' +
      '<td>' + d.name + '</td>' +
      '<td>' + d.mac + '</td>' +
      '<td>' + d.time + '</td>' +
      '</tr>';
  });
  if (!list.length) html = '<tr><td colspan="4" style="text-align:center;color:#999;padding:24px 0">暂无符合条件的设备</td></tr>';
  tb.innerHTML = html;
  var allEl = document.getElementById('dv-all');
  if (allEl) allEl.checked = list.length > 0 && list.every(function(d) { return DV_SELECTED[d.id]; });
  updateDvConfirm();
}
function onDevCheck(el) {
  var id = el.getAttribute('data-did');
  if (el.checked) DV_SELECTED[id] = true; else delete DV_SELECTED[id];
  updateDvConfirm();
}
function toggleAllDev(el) {
  (window.__DEVICE_LIST || []).forEach(function(d) { if (el.checked) DV_SELECTED[d.id] = true; else delete DV_SELECTED[d.id]; });
  renderDevPicker();
}
function dvPickedNames() {
  return (window.__DEVICE_LIST || []).filter(function(d) { return DV_SELECTED[d.id]; }).map(function(d) { return d.name; });
}
function updateDvConfirm() {
  var n = Object.keys(DV_SELECTED).length;
  var b = document.getElementById('dv-confirm');
  b.textContent = '确认（' + n + '）';
  b.className = 'dv-btn primary' + (n ? '' : ' disabled');
}
function openDeviceModal() {
  DV_SELECTED = {};
  document.getElementById('dv-kw').value = '';
  renderDevPicker();
  document.getElementById('device-modal').classList.add('show');
}
function closeDeviceModal() { document.getElementById('device-modal').classList.remove('show'); }
function nowStr() {
  var d = new Date();
  function p(n) { return ('0' + n).slice(-2); }
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}
function confirmDevice() {
  var names = dvPickedNames();
  if (!names.length) return;
  var dev = names.join('、');
  var ts = nowStr();
  if (CURRENT_DEVICE_MODE === 'batch') {
    var keys = Object.keys(SEL_SELECTED);
    SEL_LIST.forEach(function(p) { if (SEL_SELECTED[p.no]) { p.on = true; p.onScreen = dev; p.onTime = ts; } });
    SEL_SELECTED = {};
    selShowToast('已批量上屏 ' + keys.length + ' 张 → ' + dev);
  } else {
    var p = SEL_LIST.filter(function(x){ return x.no === CURRENT_DEVICE_NO; })[0];
    if (p) { p.on = true; p.onScreen = dev; p.onTime = ts; }
    selShowToast('已上屏：' + CURRENT_DEVICE_NO + ' → ' + dev);
  }
  closeDeviceModal();
  renderSelTable();
}

/* ---- 大图预览 ---- */
function openSelPreview(no) {
  var p = SEL_LIST.filter(function(x){ return x.no === no; })[0];
  if (!p) return;
  var bg = selTplBg(p.no);
  var img = document.getElementById('sel-pv-img');
  img.innerHTML = '<div class="photo-bg wb-' + bg + '"></div><div class="photo-person"></div>';
  document.getElementById('sel-pv-meta').innerHTML =
    '<b>编号：</b>' + p.no + '<br><b>模板：</b>' + p.tpl + '（' + selCapNameOf(p.tpl) + '）<br>' +
    '<b>账号：</b>' + p.wx + '　<b>来源屏幕：</b>' + p.screen + '　<b>创建时间：</b>' + p.time;
  document.getElementById('sel-preview-overlay').classList.add('show');
}
function closeSelPreview() { document.getElementById('sel-preview-overlay').classList.remove('show'); }
function selApplyFilter() { SEL_PAGE = 1; renderSelTable(); }
function selResetFilter() {
  document.getElementById('f-sel-onscreen').value = '';
  document.getElementById('f-sel-tpl').value = '';
  document.getElementById('f-sel-dir').value = '';
  document.getElementById('f-sel-src-screen').value = '';
  document.getElementById('f-sel-on-screen').value = '';
  document.getElementById('f-sel-no').value = '';
  SEL_PAGE = 1;
  renderSelTable();
}
function selBuildDetails() {
  if (!window.__PHOTO_DETAILS) window.__PHOTO_DETAILS = {};
  SEL_LIST.forEach(function(p) {
    var root = p;
    if (p.sourceWorkId) { var r = SEL_LIST.filter(function(x){ return x.no === p.sourceWorkId; })[0]; if (r) root = r; }
    window.__PHOTO_DETAILS[p.no] = {
      no: p.no, tpl: p.tpl, wx: p.wx, screen: p.screen || '—',
      onScreen: p.onScreen || '—',
      status: p.on ? 'selected' : 'wait', time: p.time || '—',
      onTime: p.onTime || (p.on ? p.onTime : null),
      offTime: p.offTime || null,
      sourceWorkId: p.sourceWorkId || '',
      styleId: p.styleId || '',
      bg: ((root.no.length + 3) % 8) + 1
    };
  });
}
function selOpenDetail(no) {
  selBuildDetails();
  if (typeof window.pdShowDetail === 'function') window.pdShowDetail(no);
}
function init_selection_mgmt() { selFillScreenFilters(); renderSelTable(); }
init_selection_mgmt();
</script>
