/* ================= 页面切换 ================= */
var PAGE_STACK = ['home'];
function showPage(id) {
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
  var el = document.getElementById('page-' + id);
  if (el) el.classList.add('active');
  var hideTabs = ['photo', 'photo-confirm', 'generating', 'terms', 'status'];
  var tabBar = document.getElementById('tab-bar');
  if (tabBar) {
    if (hideTabs.indexOf(id) >= 0) { tabBar.style.display = 'none'; }
    else { tabBar.style.display = 'flex'; tabBar.querySelectorAll('.tab-bar-item').forEach(function(t){ t.classList.toggle('active', t.getAttribute('data-page') === id); }); }
  }
  if (PAGE_STACK[PAGE_STACK.length-1] !== id) PAGE_STACK.push(id);
  return id;
}
function historyBack() {
  PAGE_STACK.pop();
  var to = PAGE_STACK[PAGE_STACK.length-1] || 'home';
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
  document.getElementById('page-' + to).classList.add('active');
  refreshTabs(to);
}
function refreshTabs(id) {
  var hideTabs = ['photo', 'photo-confirm', 'generating', 'terms', 'status'];
  var tabBar = document.getElementById('tab-bar');
  if (!tabBar) return;
  if (hideTabs.indexOf(id) >= 0) { tabBar.style.display = 'none'; return; }
  tabBar.style.display = 'flex';
  tabBar.querySelectorAll('.tab-bar-item').forEach(function(t){ t.classList.toggle('active', t.getAttribute('data-page') === id); });
}
function goHome()   { state.visitFromWall = false; PAGE_STACK.length = 0; PAGE_STACK.push('home'); showPage('home'); }

/* ================= Toast ================= */
var toastTimer = null;
function toast(text, icon) {
  var t = document.getElementById('toast');
  if (!t) return;
  document.getElementById('toast-icon').textContent = icon || '✓';
  document.getElementById('toast-text').textContent = text;
  t.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { t.classList.remove('show'); }, 2200);
}
function closeModal(id) { var el = document.getElementById(id); if (el) el.classList.remove('show'); }

/* ================= 首页精选轮播 ================= */
function renderSpot() {

      '<span class="spot-num">' + p.num + '</span>' +
      '</div>';
  });
  track.innerHTML = html;
}
