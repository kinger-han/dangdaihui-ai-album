<!-- PAGE_META: {"id": "photo", "title": "获取照片"} -->
<div class="page" id="page-photo">
  <div class="page-header">
    <button class="back-btn" onclick="historyBack()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>
    <h2>获取照片</h2>
    <span class="hdr-right"></span>
  </div>
  <div class="camera-area" id="camera-area">
    <div class="face-guide" id="face-guide"></div>
    <div class="camera-guide">
      <div class="svg-ring">
        <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/><circle cx="50" cy="50" r="30" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1"/></svg>
      </div>
      <p id="camera-tip">请将人脸置于取景框内</p>
      <p class="sub" id="camera-sub">正面看向镜头 · 光线充足 · 避免遮挡面部</p>
    </div>
  </div>
  <div id="preview-wrap" class="preview-wrap">
    <img id="preview-img" alt="拍摄预览">
    <button class="retake" onclick="retake()">↺ 重拍</button>
  </div>
  <div class="camera-bottom">
    <button class="album-btn" onclick="pickAlbum()">
      <span class="thumb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></span><span>相册</span>
    </button>
    <button class="shutter-btn" onclick="takePhoto()"></button>
    <button class="camera-flip" onclick="toast('演示环境已默认前置摄像头')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg></button>
  </div>
  <div class="confirm-bar" id="confirm-bar" style="display:none">
    <button class="btn primary" id="confirm-go-btn" onclick="startGenerate()">立即生成纪念照片</button>
  </div>
  <input type="file" id="file-input" accept="image/*" style="display:none">
</div>
<script>
/* ================= H05 获取照片（纯拍照页） ================= */
function takePhoto() {
  var area = document.getElementById('camera-area');
  var pv = document.getElementById('preview-wrap');
  var bar = document.getElementById('confirm-bar');
  area.style.display = 'none';
  pv.style.display = 'block';
  document.getElementById('preview-img').src = makePortraitSVG();
  bar.style.display = 'flex';
  state.photoTaken = true;
  state.photoSrc = makePortraitSVG();
  toast('咔嚓！请确认照片');
}
function pickAlbum() {
  document.getElementById('file-input').click();
}
function retake() {
  document.getElementById('preview-wrap').style.display = 'none';
  document.getElementById('camera-area').style.display = 'flex';
  document.getElementById('confirm-bar').style.display = 'none';
  state.photoTaken = false;
  state.photoSrc = null;
}
/* 相册选择 */
document.getElementById('file-input').addEventListener('change', function(e) {
  var file = e.target.files && e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    document.getElementById('preview-img').src = ev.target.result;
    document.getElementById('camera-area').style.display = 'none';
    document.getElementById('preview-wrap').style.display = 'block';
    document.getElementById('confirm-bar').style.display = 'flex';
    state.photoTaken = true;
    state.photoSrc = ev.target.result;
    toast('照片已就绪');
  };
  reader.readAsDataURL(file);
});
function makePortraitSVG() {
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500">' +
    '<rect width="400" height="500" fill="#3A3A40"/>' +
    '<ellipse cx="200" cy="150" rx="85" ry="100" fill="#F5D0A9"/>' +
    '<rect x="140" y="262" width="120" height="120" rx="55" fill="#D95C4A"/>' +
    '<rect x="120" y="330" width="160" height="220" rx="60" fill="#C0392B"/>' +
    '<path d="M160 420 Q200 520 240 420" fill="none" stroke="#7A1712" stroke-width="3"/>' +
    '</svg>'
  );
}
/* 演示：跳过拍照直接取照片（demoFail 使用，仅演示生成失败时） */
function takePhotoNoConsent() {
  state.photoTaken = true;
  state.photoSrc = makePortraitSVG();
  var area = document.getElementById('camera-area');
  var pv = document.getElementById('preview-wrap');
  var bar = document.getElementById('confirm-bar');
  area.style.display = 'none';
  pv.style.display = 'block';
  document.getElementById('preview-img').src = makePortraitSVG();
  bar.style.display = 'flex';
}
/* H05 → H07 立即生成（带过渡动画） */
function startGenerate() {
  if (!state.photoTaken) { toast('请先拍摄或选择照片'); return; }
  var t = findByTpl(state.selectedTpl);
  var steps = [];
  if (t.cap === 'A') steps = ['正在排版纪念信息', '正在合成高清作品'];
  else if (t.cap === 'B') steps = ['正在识别人像', '正在融合主题场景', '正在优化光影细节'];
  else steps = ['正在分析人物特征', '正在创作艺术画面', '正在完成细节优化'];
  var stepsWrap = document.getElementById('gen-steps');
  stepsWrap.innerHTML = '';
  steps.forEach(function(s, i) {
    var div = document.createElement('div');
    div.className = 'gen-step' + (i === 0 ? ' active' : '');
    div.id = 'gs-' + i;
    div.innerHTML = '<span class="s-dot"></span><span>' + s + '</span>';
    stepsWrap.appendChild(div);
  });
  document.getElementById('gen-title').textContent = '正在创作你的纪念照';
  document.getElementById('gen-sub').textContent = '预计 ' + t.time + ' 完成，请稍候';
  document.getElementById('gen-overtime').style.display = 'none';
  document.getElementById('gen-fail').classList.remove('show');
  document.getElementById('gen-working').style.display = 'block';
  var bgThumb = document.getElementById('gen-bg-thumb');
  bgThumb.style.background = 'linear-gradient(170deg, #50100F 0%, #7A1712 60%, #B42318 100%)';
  if (state.generationFail) {
    var fail = state.generationFail;
    state.generationFail = null;
    showPage('generating');
    var fi = 0;
    var ftimer = setInterval(function() {
      fi++;
      if (fi < steps.length && document.getElementById('gs-' + (fi-1))) document.getElementById('gs-' + (fi-1)).className = 'gen-step done';
      if (fi >= 2) {
        clearInterval(ftimer);
        setTimeout(function() { showGenFail(fail); }, 600);
      }
    }, 500);
    return;
  }
  showPage('generating');
  startGenTimer(steps);
}
</script>
