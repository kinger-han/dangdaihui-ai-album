<!-- PAGE_META: {"id": "status", "title": "活动状态"} -->
<div class="page status-page" id="page-status">
  <style>
    /* 状态页样式全部写在本页内（组件内 style 随页面注入保留），
       不依赖壳内 .status-page 的 background —— build.py 注入的 .page{background:#fff}
       在壳样式之后，会覆盖壳内规则，所以背景层单独用 .st-bg 自带。 */
    #page-status .st-bg {
      position: absolute; inset: 0;
      background: linear-gradient(170deg, #6B1512 0%, #8C1D15 45%, #A8271B 100%);
    }
    #page-status .st-inner {
      position: relative; z-index: 1;
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 28px 22px 40px; text-align: center; color: #fff;
    }
    #page-status .st-icon { line-height: 0; margin-bottom: 20px; }
    #page-status .st-icon svg { width: 60px; height: 60px; color: #fff; opacity: 0.95; }
    #page-status .st-title { font-size: 23px; font-weight: 700; letter-spacing: 2px; color: #fff; }
    #page-status .st-desc { font-size: 14px; color: rgba(255,255,255,0.82); margin-top: 12px; line-height: 1.7; }
    #page-status .st-meta {
      width: 100%; max-width: 320px; margin-top: 28px;
      background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.24);
      border-radius: 12px; padding: 2px 16px;
    }
    #page-status .st-meta-row {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 13px 0; border-bottom: 1px solid rgba(255,255,255,0.16);
    }
    #page-status .st-meta-row:last-child { border-bottom: none; }
    #page-status .st-meta-k { font-size: 13px; color: rgba(255,255,255,0.75); flex-shrink: 0; }
    #page-status .st-meta-v {
      font-size: 13px; color: #fff; font-weight: 500; text-align: right;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #page-status .st-btns {
      display: flex; flex-direction: column; gap: 10px;
      margin-top: 28px; width: 100%; max-width: 240px;
    }
    #page-status .status-btn {
      min-height: 46px; border-radius: 22px; border: none;
      font-size: 15px; font-weight: 600; cursor: pointer;
    }
    #page-status .status-btn.primary { background: #fff; color: #A8271B; }
    #page-status .status-btn.plain { background: rgba(255,255,255,0.16); color: #fff; border: 1px solid rgba(255,255,255,0.4); }
  </style>
  <!-- 自带背景层：build.py 注入的 .page{background:#fff} 优先级高于壳内样式，
       所以背景/配色全部收在 .st-bg 这一层里，不依赖 .status-page 的 background -->
  <div class="st-bg" id="status-bg"></div>
  <div class="st-inner">
    <div class="st-icon" id="status-icon"></div>
    <div class="st-title" id="status-title">活动即将开始</div>
    <div class="st-desc" id="status-desc">敬请期待现场纪念相册</div>

    <div class="st-meta" id="status-meta">
      <div class="st-meta-row"><span class="st-meta-k">活动名称</span><span class="st-meta-v" id="st-meta-name">—</span></div>
      <div class="st-meta-row"><span class="st-meta-k">活动时间</span><span class="st-meta-v" id="st-meta-time">—</span></div>
      <div class="st-meta-row" id="st-meta-count-row"><span class="st-meta-k">已有多少人参与</span><span class="st-meta-v" id="st-meta-count">—</span></div>
    </div>

    <div class="st-btns" id="status-btns"></div>
  </div>
</div>
<script>
/* H12 活动状态页：通用版，内容全部由 shell 的 demoStatus() 注入
   活动状态枚举与 PC 端一致：notstart 未开始 / running 进行中 / ended 已结束（无暂停） */
</script>
