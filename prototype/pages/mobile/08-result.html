<!-- PAGE_META: {"id": "result", "title": "作品结果"} -->
<div class="page" id="page-result">
  <div class="page-header">
    <button class="back-btn" onclick="onResultBack()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>
    <h2>我的纪念作品</h2>
    <span class="hdr-right" onclick="goMine()">我的纪念</span>
  </div>
  <div class="page-body">
    <div class="result-hero">
      <div class="result-photo" id="result-photo" onclick="openFullPhoto()">
        <div class="photo-bg"></div>
        <div class="photo-person" id="result-person"></div>
      </div>
      <div class="result-number" id="result-number">第 328 号纪念档案 · FJDH-0328-01</div>
    </div>
    <div class="result-info">
      <div class="r-title" id="result-tpl-name"></div>
      <div class="r-tip" id="result-tip"></div>
    </div>
    <div class="result-actions">
      <button class="ra-btn primary" onclick="saveResult()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> 保存纪念照</button>
      <button class="ra-btn gold" onclick="genShare()">生成朋友圈分享图</button>
      <div class="ra-secondary">
        <span class="ra-link" onclick="retryCreate()">↻ 换个模板再创作</span>
        <span class="ra-link" onclick="goPhoto()">换一张照片</span>
      </div>
    </div>
    <!-- 精选邀请区 -->
    <div class="selection-box">
      <div class="sb-title">⭐ 有机会亮相现场大屏</div>
      <div class="sb-desc">提交后，作品将经过内容检查和工作人员精选。入选作品可能在现场大屏展示。</div>
      <div class="sb-check" id="sb-check" onclick="toggleSbCheck()">
        <span class="ck-box" id="sb-ck-box">✓</span>
        <span>我同意将这张作品用于本次活动现场展示</span>
      </div>
      <button class="sb-btn disabled" id="sb-submit" onclick="submitSelection()">提交现场精选</button>
      <div class="sb-link" onclick="goTerms()">查看展示说明</div>
    </div>
  </div>

  <!-- 保存长按弹层 -->
  <div class="save-modal" id="save-modal">
    <span class="sv-close" onclick="closeModal('save-modal')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></span>
    <div class="sv-photo" id="sv-photo"></div>
    <div class="sv-tip">长按图片，选择“保存图片”</div>
  </div>

  <!-- 分享海报弹层 -->
  <div class="share-modal" id="share-modal">
    <span class="sh-close" onclick="closeModal('share-modal')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></span>
    <div class="share-poster">
      <div class="sp-top">
        <div class="sp-party">中国共产党福建省第十二次代表大会</div>
        <div class="sp-name">AI 纪念相册</div>
      </div>
      <div class="sp-photo" id="sp-photo">
        <div class="photo-bg"></div>
        <div class="photo-person"></div>
      </div>
      <div class="sp-slogan">定格奋斗身影 · 共绘时代华章</div>
      <div class="sp-bottom">
        <div class="sp-num" id="sp-num">第 328 号纪念档案<br>FJDH-0328-01</div>
        <div class="sp-qr">扫码<br>留纪念</div>
      </div>
    </div>
    <div class="sh-tip">长按海报保存，可分享至朋友圈</div>
  </div>

  <!-- 精选提交成功弹层 -->
  <div class="submit-modal" id="submit-modal">
    <div class="sm-card">
      <div class="sm-check">✓</div>
      <div class="sm-title">已提交现场精选</div>
      <div class="sm-desc">工作人员将从符合展示要求的作品中进行精选。<br>你可以在 <b>“我的纪念”</b> 查看状态。</div>
      <div class="sm-btns">
        <button class="btn plain" onclick="closeModal('submit-modal')">知道了</button>
        <button class="btn primary" onclick="closeSubmitGoMine()">查看我的纪念</button>
      </div>
    </div>
  </div>

  <!-- 沉浸预览 -->
  <div class="full-photo" id="full-photo">
    <span class="fp-close" onclick="closeModal('full-photo')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></span>
    <div class="fp-img">
      <div class="photo-bg"></div>
      <div class="photo-person"></div>
    </div>
  </div>
</div>
<script>
/* ================= H08 作品结果 ================= */
function renderResult() {
  var t = findByTpl(state.curWork.tpl);
  document.getElementById('result-number').textContent = '第 ' + ACTIVITY.archiveIndex + ' 号纪念档案 · ' + state.curWork.no;
  var photo = document.getElementById('result-photo');
  photo.querySelector('.photo-bg').setAttribute('data-tpl', t.id);
  document.getElementById('result-tpl-name').textContent = t.name + ' · ' + CAPABILITIES[t.cap].name;
  document.getElementById('result-tip').textContent = CAPABILITIES[t.cap].desc;
  state.sbChecked = false;
  document.getElementById('sb-check').classList.remove('checked');
  document.getElementById('sb-submit').className = 'sb-btn disabled';
  showPage('result');
  toast('纪念作品生成完成');
}
function openFullPhoto() {
  var t = findByTpl(state.curWork.tpl);
  var fp = document.getElementById('full-photo');
  fp.querySelector('.fp-img .photo-bg').setAttribute('data-tpl', t.id);
  fp.classList.add('show');
}
function saveResult() {
  var t = findByTpl(state.curWork.tpl);
  var sv = document.getElementById('sv-photo');
  sv.innerHTML = '<div class="photo-bg" data-tpl="' + t.id + '"></div><div class="photo-person" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:58%;aspect-ratio:3/4;border-radius:8px;z-index:2;box-shadow:0 4px 20px rgba(0,0,0,0.3)"></div>';
  document.getElementById('save-modal').classList.add('show');
}
function genShare() {
  var t = findByTpl(state.curWork.tpl);
  var sp = document.getElementById('sp-photo');
  sp.querySelector('.photo-bg').setAttribute('data-tpl', t.id);
  document.getElementById('sp-num').innerHTML = '第 ' + ACTIVITY.archiveIndex + ' 号纪念档案<br>' + state.curWork.no;
  document.getElementById('share-modal').classList.add('show');
}
function toggleSbCheck() {
  var wrap = document.getElementById('sb-check');
  var btn = document.getElementById('sb-submit');
  wrap.classList.toggle('checked');
  state.sbChecked = wrap.classList.contains('checked');
  btn.className = 'sb-btn' + (state.sbChecked ? '' : ' disabled');
}
function submitSelection() {
  if (!state.sbChecked) { toast('请先勾选同意展示授权', '⚠️'); return; }
  if (state.curWork) state.curWork.status = 'wait';
  document.getElementById('submit-modal').classList.add('show');
}
function closeSubmitGoMine() {
  document.getElementById('submit-modal').classList.remove('show');
  goMine();
}
function retryCreate() { goTemplates(); }
function onResultBack() { goHome(); }
</script>
